[project]
name = "breeze-infra"
version = "0.1.0"
description = "Modal deployment surface for the Breeze-TTS-2 demo: image, weights volume, serving class, and deployment configuration."
requires-python = ">=3.12"
dependencies = [
    "modal>=0.64",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
