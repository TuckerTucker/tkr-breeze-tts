[project]
name = "breeze-bench"
version = "0.1.0"
description = "Instrumented client that turns the plan's two unmeasured quantities — warmup duration and cfg_scale fast-path fall-off — into recorded numbers."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
breeze-bench = "bench.harness:main"
breeze-cfg-probe = "bench.cfg_probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
