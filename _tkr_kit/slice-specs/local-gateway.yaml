capability: local-gateway
slice_specs:
  - title: Credential proxy
    status: done
    purpose: Give the browser a same-origin endpoint to talk to, so the Modal
      credential stays server-side and CORS never arises.
    interface: POST /api/speech and GET /api/health on localhost; forwards to the
      Modal endpoint with auth headers attached server-side.
    behavior: Read the Modal base URL and the Modal-Key/Modal-Secret pair from the
      environment at startup and validate them before accepting traffic. Attach
      the pair to every forwarded request. Serve the UI from the same origin so
      no cross-origin request is ever made. Never include the token, the header
      names, or the Modal URL in any response body or error. Log through pino
      with the credential redacted.
    errors: Missing or malformed credentials at startup → refuse to start, naming
      the missing variable and how to create a token pair. Upstream 401/403 →
      surfaced as a configuration error, distinct from a synthesis failure.
      Upstream 409 → a typed busy response the UI renders as a disabled state,
      not an error. Upstream timeout → typed as such, distinguishable from a
      cold start.
    tests: No response body or header contains any part of the token. Startup with
      an absent variable fails with the remedy named. A stubbed upstream 409
      produces the typed busy shape. Logs contain no credential material.
    slice: 1
    evidence:
      kind: commit
      ref: 69103a2
  - title: Dual transport
    status: done
    purpose: Offer buffered-WAV and streaming-PCM delivery behind one setting,
      without changing the contract the browser uses.
    interface: "One configuration value, transport: 'buffered' | 'streaming'. The
      route shape and request body are identical in both."
    behavior: In buffered mode, read the upstream stream to completion, prepend a
      WAV header built from the upstream X-Sample-Rate and X-Sample-Format
      headers, and respond as audio/wav. In streaming mode, pipe the upstream
      body through with no buffering and no transformation, preserving the
      format headers. Never hardcode 24000 or s16le a second time — take both
      from upstream so the two paths cannot drift.
    errors: Missing upstream format headers → fail loudly rather than assume a rate,
      since a wrong header produces audio that plays at the wrong speed instead
      of failing. Upstream stream aborted mid-flight → buffered mode returns an
      error rather than a truncated WAV claiming full length; streaming mode
      ends the response and the client is told it was incomplete.
    tests: Buffered output is a valid WAV whose header matches upstream values,
      verified by decoding. Streaming output reaches the client before upstream
      completion, asserted on first-byte timing. Both transports accept an
      identical request. A wrong-rate header is rejected, not silently accepted.
    slice: 2
    evidence:
      kind: commit
      ref: 69103a2
  - title: Reference intake
    status: done
    purpose: Make browser-recorded audio usable for cloning without the operator
      converting anything by hand.
    interface: Multipart intake of ref_audio plus ref_text on the synthesis route;
      forwards a WAV upstream.
    behavior: Detect the incoming container. Normalise reference audio to mono WAV
      via ffmpeg — both the WebM/Opus that MediaRecorder produces and uploaded
      files in common containers such as MP3, M4A, OGG or FLAC. Pass through
      only audio that is already a conforming WAV; anything else is converted
      rather than forwarded, because the vendor reads reference audio through
      soundfile and a container it cannot decode would fail inside the loader
      rather than here. Enforce the vendor's both-or-neither rule on ref_audio
      and ref_text locally, before the request leaves the machine, so an
      incomplete pair never wakes a GPU. Delete temporary files on both success
      and failure paths.
    errors: ffmpeg absent → detected at startup and reported with the install
      command, not at first use. An unsupported or non-audio file → rejected
      with the detected type named, before transcode. Transcode failure → a
      typed error naming the input problem rather than a generic 500. Audio
      without transcript, or transcript without audio → refused locally naming
      which half is missing. Unreadable or empty upload → rejected before
      transcode.
    tests: A WebM fixture is transcoded and forwarded as WAV. MP3, M4A and FLAC
      fixtures are each normalised to WAV rather than passed through. An
      already-conforming WAV passes through unmodified. A non-audio file is
      rejected with its detected type. Each half of an incomplete pair is
      refused with the missing half named. Temporary files are absent after both
      a success and a forced failure.
    slice: 3
    evidence:
      kind: commit
      ref: 69103a2
  - title: Clip cache
    status: done
    purpose: Keep every generated clip on disk so replay is instant, free, and works
      while the GPU is scaled to zero.
    interface: GET /api/clips and GET /api/clips/:id served from disk; writes happen
      as a side effect of synthesis.
    behavior: "Tee the upstream audio to disk while forwarding it, without delaying
      bytes to the client. The cache holds exactly one on-disk format — raw PCM
      s16le as Modal emits it — beside a sidecar record carrying the upstream
      sample rate and format plus the request provenance: text, instruction,
      mode, cfg_scale, seed, transport, and measured first-byte time. WAV
      framing is applied at read, never at write, so the bytes on disk do not
      depend on which transport produced them and a clip generated while
      streaming is interchangeable with one generated buffered. Serve replay as
      a buffered read framed as WAV from the sidecar values, regardless of the
      active transport. Maintain an index for listing. Evict oldest-first once a
      configured size limit is reached."
    errors: A disk write failure → logged and the stream to the client continues
      uninterrupted, because losing a cache entry must never cost the operator
      their audio. A missing or corrupt cached file → reported as absent and
      removed from the index rather than served as a truncated clip. A sidecar
      missing its sample rate → the clip is dropped from the index rather than
      served at a guessed rate, since a wrong rate plays at the wrong speed
      instead of failing. A full disk → eviction runs, and if space cannot be
      reclaimed, caching disables itself rather than failing synthesis.
    tests: First-byte timing with caching on matches caching off within tolerance.
      Replay serves from disk with no upstream request, asserted with the
      upstream unreachable, and decodes as a valid WAV whose header matches the
      sidecar. Identical requests made under streaming and under buffered
      transport leave byte-identical payloads on disk. Eviction removes
      oldest-first at the limit. A deliberately corrupted file is dropped from
      the index rather than served.
    slice: 4
    evidence:
      kind: commit
      ref: 69103a2
  - title: Voice library store
    status: done
    purpose: Give a created voice a durable identity the model itself cannot
      provide, so reusing it is a lookup rather than a reconstruction.
    interface: GET /api/voices, POST /api/voices, PATCH /api/voices/:id, DELETE
      /api/voices/:id; reads return audio path plus exact transcript together.
    behavior: Store each voice as its own conforming WAV, its exact transcript, an
      optional default direction instruction, a name, and provenance
      (designed-from-instruction with seed, or cloned-from-supplied-audio). Copy
      the audio into the voice store rather than referencing a cache entry, so
      voice lifetime is independent of clip eviction. When saving from a
      generated clip, copy the cached PCM and frame it as WAV using that clip's
      sidecar rate and format — a container write, not a re-encode, and never a
      second GPU request. When saving from an upload, route through the same
      reference-intake normalisation. Reads always return audio and transcript
      as a pair. Persist across restarts.
    errors: A name that already exists → accepted with a disambiguating suffix
      rather than refused, since the operator is naming, not keying. A voice
      whose audio file is missing → reported as unavailable and excluded from
      selection rather than producing a request the vendor will reject. A delete
      → soft for long enough to support undo in the UI, then final; deleting a
      voice never touches the clips it was made from. A save from a clip that
      has been evicted → refused with that stated, since there is no audio left
      to copy.
    tests: A voice saved from a clip carries the same sample data as the cached
      clip, verified by hashing the PCM inside both, with no transcode and no
      upstream request. Evicting the source clip leaves the voice usable. A read
      returns audio and transcript together, never one alone. Voices survive a
      restart with name and provenance intact. Deleting a voice leaves its
      source clips present. A duplicate name is disambiguated rather than
      rejected.
    slice: 5
    evidence:
      kind: commit
      ref: 69103a2
  - title: Script runner
    status: done
    purpose: Turn a script into voiced audio cue by cue, cheaply re-runnable, with
      timing reported honestly rather than forced.
    interface: POST /api/scripts (import VTT or text), GET /api/scripts/:id, POST
      /api/scripts/:id/run, GET /api/scripts/:id/export.vtt, GET
      /api/scripts/:id/export.wav
    behavior: "Parse WebVTT into cues carrying index, target start/end and text;
      accept plain text as untimed cues. Run cues strictly sequentially, one
      request each, with the cue's assigned voice supplying reference audio and
      transcript together. Key each cue's cache entry on text + voice + cfg +
      seed so an unchanged cue is served from disk and never reaches the GPU.
      Measure each generated cue's duration as bytes / 2 / 24000 and, where a
      target exists, record the drift. On export, emit VTT whose timings are the
      generated durations re-flowed from zero, and optionally concatenate cue
      audio into one continuous WAV. One request per cue is required, not
      preferred: the served API exposes no speaker field, so a multi-voice
      script cannot be expressed as a single dialogue call even though the model
      supports one."
    errors: A malformed cue → named and skipped, the remaining cues still import;
      the file is not rejected wholesale. A cue whose assigned voice is missing
      or unavailable → that cue fails and is marked, the run continues and is
      resumable rather than aborting the script. An upstream 409 → impossible by
      construction, since the queue is sequential; if seen, treated as a fault
      and retried once. A cue exceeding the model's token ceiling → refused
      before dispatch with the limit named, rather than truncated silently.
      Drift of any size → recorded, never resolved by time-stretching or pitch
      correction.
    tests: A VTT round-trips to cues and back with generated timings, not imported
      ones. A script with three different voices issues three separate requests.
      Re-running after one edit issues exactly one GPU request. A malformed cue
      is skipped with the rest importing. A missing voice fails one cue and
      leaves the run resumable. Concatenated export decodes as one continuous 24
      kHz mono WAV whose length equals the sum of cue durations.
    slice: 6
    evidence:
      kind: commit
      ref: 69103a2
  - slice: 7
    status: done
    title: Mode-aware input ceiling
    purpose: Refuse, before a GPU is woken, any request whose longest text segment
      exceeds the ceiling its branch mode actually carries.
    interface: "`textEncoderBatch(mode, cfgScale): 1 | 2 | 4` and
      `tokenCeilingFor(mode, cfgScale): 256 | 512`, replacing
      `tokenCeilingFor(cfgScale)`. A check over the segments a request will
      produce, returning which field exceeded and by how much. The same table is
      mirrored in ui/src/state/draft.ts."
    behavior: "Resolve the batch from the template and the branch count:
      tts_instruction is one text segment, ref_edit_tata is two; cfg 1.0 is a
      single branch, anything else dual. So Design/1.0 → batch 1 → 256;
      Design/!=1.0 and Clone/1.0 → batch 2 → 512; Clone/!=1.0 → batch 4 → 512
      (available only because extend_warmup_profile.py declares it). Measure
      text, instruction and refText, and compare the LARGEST against the ceiling
      — the graph's token_length is the padded maximum across the batch, so a
      sum would over-refuse and measuring text alone under-refuses. Keep the
      estimator conservative for text that is not Latin script, since four
      characters per token is an English average on a bilingual model."
    errors: Over the ceiling → a typed validation failure naming the field, its
      estimated tokens, and its ceiling, with a remedy that says which box to
      shorten. Never a 500, and never a request that reaches Modal — the whole
      point is that the cold start is not spent to learn this.
    tests: The ceiling table is asserted for all six (mode, cfg) combinations. A
      short line with a long reference transcript is refused, naming the
      transcript — the exact 2707-character input that produced `(2, 640)` in
      production is the fixture. Clone at cfg 1.0 accepts a 400-token line,
      which the old cfg-only table wrongly refused. A non-Latin input of the
      same character count estimates higher than an English one. The gateway and
      UI tables agree, asserted rather than assumed.
    evidence:
      kind: commit
      ref: 17053ee
  - slice: 8
    status: done
    title: Staged reference resource
    purpose: Hold an uploaded recording once, with everything needed to choose a
      section of it, and send only that section.
    interface: "POST /api/reference (multipart) → {id, durationSeconds, sampleRate,
      peaks[], words[], transcript, language}. GET
      /api/reference/:id/audio?start=&end= → WAV of the window. DELETE
      /api/reference/:id. POST /api/speech accepts reference_id + ref_start +
      ref_end in place of ref_audio. Pure: `peaksFrom(pcm, format, buckets)` and
      `sliceTranscript(words, start, end)`. New config: MODAL_ASR_URL,
      REFERENCE_STORE_DIR, REFERENCE_MAX_AGE_MS."
    behavior: "On intake: normalise through the existing normaliseReference, compute
      peaks from the resulting PCM, then transcribe via the ASR proxy with the
      credential attached server-side. Persist the WAV plus one sidecar holding
      peaks, words, duration and language — the same one-format-on-disk
      discipline the clip cache already keeps. On synthesis: trim with ffmpeg
      -ss/-to and send the transcript sliceTranscript returns for that window,
      so the pair cannot drift. Snap window edges to word boundaries in the pure
      module, not in the UI, so the rule is testable and both callers get it.
      Route microphone capture through the same intake. Sample rate and format
      come from the normalised file, never hardcoded."
    errors: "No MODAL_ASR_URL → intake succeeds with an empty transcript and
      /api/health reports asr unavailable with its remedy, exactly as a missing
      ffmpeg already degrades. ASR upstream failure → same, logged, never fatal
      to intake: a typed transcript is still possible by hand. Unknown
      reference_id → typed not-found. A window outside the audio, or inverted →
      typed validation naming the duration it had."
    tests: Peaks and transcript slicing are tested as pure functions with no
      filesystem. Snapping never yields a window whose transcript contains a
      word the audio does not fully contain. A trimmed window is byte-exact
      against ffmpeg run directly. Intake with the ASR proxy stubbed absent
      still returns a usable reference. Two syntheses from one reference perform
      one upload and one transcription. Eviction removes the WAV and its sidecar
      together, and a voice promoted beforehand still reads.
    evidence:
      kind: manual
      ref: Gateway build and typecheck passed; 171 gateway tests passed on 2026-09-01.
  - slice: 9
    status: done
    title: Voice-intent resolver
    purpose: Make reference presence and one instruction the only authority for
      selecting a vendor request shape.
    interface: "`VoiceIntent = {text, instruction, cfgScale, seed, reference?:
      ResolvedReference}` where `ResolvedReference` always contains audio plus
      exact transcript. `resolveVoiceIntent(intent) -> {template:
      'tts_instruction' | 'ref_edit_tata', derivedMode, segments, provenance}`.
      The gateway resolves voiceId or staged reference ids before calling this
      pure function."
    behavior: If no reference exists, select the described template. If a complete
      reference exists, select the referenced template regardless of whether the
      operator is cloning neutrally or steering delivery; instruction and CFG
      carry that distinction. Compute token segments and ceiling from the
      derived template plus CFG branch, then build provenance from the same
      normalized values. Parse legacy mode only as migration metadata and never
      use it to choose a template.
    errors: Reference audio without exact transcript, transcript without audio,
      unresolved voiceId, or invalid staged window produces a typed local
      validation failure naming the missing or invalid part. A legacy mode
      contradicting reference presence is logged as a compatibility mismatch and
      cannot change the derived shape. No invalid intent reaches the proxy.
    tests: Table-driven cases cover no reference and every complete reference source
      at CFG 1.0 and above 1.0. The resulting template, derived display
      metadata, token ceiling, and provenance agree. Incomplete pairs and
      contradictory legacy modes cannot select the wrong template or call
      upstream.
    evidence:
      kind: manual
      ref: Gateway build and typecheck passed; 171 gateway tests passed on 2026-09-01.
  - slice: 10
    status: done
    title: Script defaults and cue overrides
    purpose: Persist common delivery once per script while keeping explicit cue
      differences and stale-only regeneration correct.
    interface: "Extend `ScriptRecord` with `defaults: {voiceId, instruction,
      cfgScale, seedMode, seed}` and each cue with nullable overrides for the
      same effective fields. `effectiveCueSettings(script, cue)` resolves
      override-first values. Script-store update methods patch defaults or one
      cue and return the affected cue ids."
    behavior: Load older records through a versioned migration that supplies neutral
      instruction, CFG 1.0, and existing per-cue voice/seed values without
      rewriting content until save. A default change compares each cue's
      effective value before and after and marks only changed inheriting cues
      stale. Explicit overrides remain untouched. Cache identity is computed
      from effective text, voice/reference, instruction, CFG, and seed.
    errors: A deleted default voice leaves inheriting cues unrunnable with the voice
      named while overridden cues remain independent. Invalid numeric settings
      are refused before persistence. A migration failure preserves the original
      file and reports which record could not be read. No partial write leaves
      defaults and cue states out of sync.
    tests: Existing fixture records migrate without content loss. Each default field
      and override precedence is table-tested. Changing a default stales only
      inheriting cues whose effective value changed. Instruction changes alter
      cache keys. Store reload restores defaults, overrides, and cue states
      exactly.
    evidence:
      kind: manual
      ref: Gateway build and typecheck passed; 171 gateway tests passed on 2026-09-01.
  - slice: 11
    status: done
    title: Unified speech and script API
    purpose: Expose the voice-intent contract to both one-off synthesis and
      persistent scripts without requiring a UI mode.
    interface: POST `/api/speech` accepts text, instruction, cfg_scale, seed, and
      optional voice_id or reference_id/ref_start/ref_end; legacy mode is
      optional during migration. GET `/api/scripts` returns document summaries.
      GET/PATCH `/api/scripts/:id` reads and updates script defaults. PATCH
      `/api/scripts/:id/cues/:cueId` accepts nullable cue overrides. Both speech
      and script execution call the injected voice-intent resolver.
    behavior: Resolve all reference identifiers into complete audio/transcript pairs
      first. Normalize fields once, resolve intent, apply ceiling validation,
      then proxy/cache using the normalized result. Script list summaries are
      sufficient to restore the last-open document without loading every cue.
      Default updates return refreshed cue states after inherited-value
      invalidation. A script run resolves each stale cue immediately before
      dispatch.
    errors: Unknown voice, reference, script, or cue ids return typed not-found
      failures. Conflicting reference sources or incomplete staged intervals
      return typed validation. Legacy mode mismatch cannot choose the template.
      One failed cue remains contextual to that cue and does not erase other
      script progress.
    tests: API tests prove described and referenced requests produce the expected
      upstream multipart fields with no mode requirement. Script summaries
      reopen documents, default patches persist, cue overrides win, and
      stale-only runs call the resolver once per stale cue. Legacy clients
      remain readable during migration.
    evidence:
      kind: manual
      ref: Gateway build and typecheck passed; 171 gateway tests passed on 2026-09-01.
  - slice: 12
    status: done
    title: Wire the voice-intent contract
    purpose: Compose one resolver and one normalized request path across the gateway
      without duplicating request-shape logic.
    interface: The gateway assembly injects reference resolvers, voice lookup,
      cache, proxy, and logger into a speech-intent service used by route
      handlers and the cue queue. Existing stores remain the only persistence
      dependencies.
    behavior: Create the resolver once during gateway composition. Route one-off and
      script synthesis through it after their source-specific lookup. Keep HTTP
      parsing, domain resolution, proxy transport, and persistence separated
      behind injected interfaces. Emit structured events for intent shape,
      migration, and validation state without logging text, transcripts, or
      audio.
    errors: A dependency that cannot initialize prevents readiness with its remedy.
      A resolver or migration failure is wrapped with operation and entity
      context. Existing cached clips and scripts remain readable while canonical
      writes use the new shape.
    tests: Composition tests substitute reference, voice, cache, and proxy fakes.
      Both entry points invoke the same resolver. Structured logs contain
      identifiers and derived shape but no content. Restart tests confirm
      migrated records and cache entries remain usable.
    evidence:
      kind: manual
      ref: Gateway build and typecheck passed; 171 gateway tests passed on 2026-09-01.
  - slice: 13
    status: done
    title: Voice-intent contract regression suite
    purpose: Pin the shared contract, migrations, and selective script invalidation
      before the UI depends on them.
    interface: Gateway unit and integration suites covering resolver tables, API
      multipart projection, script-store migration, cue invalidation, cache
      keys, and proxy call counts.
    behavior: Exercise the contract at domain, store, route, and composed-service
      boundaries. Use deterministic fixtures and injected upstream fakes. Assert
      both successful output and the absence of upstream calls on invalid input.
    errors: Any mismatch between one-off and script resolution, loss during
      migration, cache collision after a visible setting change, or invalid
      request reaching upstream fails the suite with the effective intent
      identified.
    tests: Cover described/referenced x CFG branch x reference source, legacy mode
      mismatches, incomplete pairs, default/override combinations, deleted
      voices, migration and restart, stale-only reruns, and structured-log
      redaction.
    evidence:
      kind: manual
      ref: Gateway build and typecheck passed; 171 gateway tests passed on 2026-09-01.
