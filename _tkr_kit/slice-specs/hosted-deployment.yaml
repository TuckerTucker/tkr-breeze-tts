capability: hosted-deployment
slice_specs:
  - slice: 1
    status: draft
    title: Hosting image
    purpose: Produce an image in which the existing Node gateway runs unmodified,
      with every external thing it expects to find on the operator's Mac present
      in the container instead.
    interface: A module exporting a modal.Image, consumed by the hosting app exactly
      as infra/image.py is consumed by infra/service.py. No decorator arguments
      live here.
    behavior: "Start from a Debian base with Node 20 (the gateway declares engines
      >=20.11). apt-install ffmpeg. Copy gateway/package.json and
      gateway/package-lock.json and run a locked production install, so the
      hosted runtime is the pinned dependency set rather than whatever resolves
      on build day. Copy gateway/src, ui/dist, and bench/findings. Order the
      layers for cache reuse the way infra/image.py does: the npm install sits
      below the source copy, so editing a route rebuilds only the cheap layer.
      Fix the in-image destinations as this slice's published contract — an
      absolute path for the UI and an absolute path for the findings — because
      slice 3 sets UI_DIST_DIR and BENCH_FINDINGS_DIR to exactly these and
      config.ts resolves a relative path against a REPO_ROOT derived from the
      module's own location, which in a container is not a layout worth
      reasoning about. Run a build-time check in the spirit of
      infra/smoke_check.py asserting that node and ffmpeg both execute, that
      index.html exists at that fixed UI path, and that
      ui/public/pcm-processor.js survived the Vite build into dist
      untransformed — it is deliberately not bundled, and an image that lost it
      fails only at first playback. Assert latency.json is present at the fixed
      findings path and parses."
    errors: "ffmpeg absent or non-executable → fail the build. It is not optional
      here: at runtime the gateway degrades to WAV-only and writes one warning
      into a container log nobody reads, so recorded reference capture would
      simply stop working with no visible cause. ui/dist missing → fail the
      build naming `npm run build`, rather than shipping an image whose UI is a
      404. Findings missing → fail the build; the UI would otherwise render 'not
      yet measured' for figures that are measured, which is the one thing the
      wake state exists to avoid."
    tests: The image is constructed but never built in tests, matching the standing
      rule that no test needs a network or a GPU. Assert the declared Node major
      version matches gateway/package.json engines. Assert ffmpeg is in the apt
      layer. Assert the copied paths cover ui/dist, bench/findings, gateway/src
      and both gateway manifests. Assert the npm install layer precedes the
      source copy, since layer order is the property being relied on.
  - slice: 2
    status: draft
    title: Bind host and state locations as configuration
    purpose: Let one gateway serve a Mac on loopback and a container on 0.0.0.0
      without a fork, and prove the local path is unchanged rather than assuming
      it.
    interface: "GatewayConfig gains a readonly `host: string`. GATEWAY_HOST joins
      the existing environment surface in gateway/src/config.ts and
      .env.example. index.ts listens on config.host instead of the literal
      127.0.0.1."
    behavior: "Default GATEWAY_HOST to 127.0.0.1, so an operator who changes nothing
      gets exactly today's behaviour and stays unreachable from off the machine.
      Accept 0.0.0.0 and any literal address; reject anything else at startup
      with a named remedy, the way ConfigError already handles a malformed
      credential — a gateway that binds an address nobody expected is worse than
      one that refuses to start. Extend the startup log line, which already
      reports port, transport, ffmpeg and asr, with the resolved host and the
      resolved state root. The four store directories and the findings directory
      already resolve from the environment through resolveFromRoot, which
      returns an absolute path unchanged, so a Volume mount path passes through
      without new code; this slice adds a test asserting that rather than new
      behaviour. Leave readEnv alone: it already merges a missing .env into an
      empty map and lets the process environment win, which is exactly what a
      modal.Secret needs."
    errors: A GATEWAY_HOST that is not a valid literal address → ConfigError at
      startup naming the accepted forms. Absent GATEWAY_HOST → not an error; it
      is the local default. A store directory that resolves outside the mount in
      a hosted container → not detectable from configuration alone, so the
      startup log states the resolved paths and the deploy smoke check in slice
      8 is what actually catches it.
    tests: With no GATEWAY_HOST, config.host is 127.0.0.1. With 0.0.0.0, it is
      0.0.0.0. A malformed value raises ConfigError carrying a remedy. Absolute
      store paths pass through resolveFromRoot unchanged. Credentials supplied
      only via processEnv validate with no .env file present, and the same
      values in a .env file with no processEnv also validate. The startup log
      line includes host and state root.
  - slice: 3
    status: draft
    title: The hosting app
    purpose: Run the Node gateway on Modal with durable state and a posture that
      matches what the stores actually require.
    interface: A HostingConfig frozen dataclass in infra/config.py beside
      ServiceConfig and AsrConfig, read from the environment by a
      hosting_config_from_env function following the existing pattern.
      infra/hosting.py declares the app, the Volume, and one function decorated
      @modal.web_server(port).
    behavior: "Declare a modal.Volume for gateway state, separate from the weights
      Volume — weights are a 7.7 GB read-mostly fill and gateway state is small
      and written constantly, and one Volume for both would make every clip
      write contend with a checkpoint. Mount it and set CLIP_CACHE_DIR,
      VOICE_STORE_DIR, SCRIPT_STORE_DIR and REFERENCE_STORE_DIR beneath the
      mount, with BENCH_FINDINGS_DIR and UI_DIST_DIR pointing into the image.
      Every one of these is an absolute path, without exception: config.ts
      resolves a relative store path through resolveFromRoot against a REPO_ROOT
      derived from the module's own location, which in the image is wherever the
      source was copied and not a layout anyone should have to reason about.
      Set GATEWAY_HOST to 0.0.0.0. Attach the Modal proxy pair and the password
      hash from Secrets. In the web_server function, spawn the gateway with
      subprocess.Popen and return; Modal waits for the port. Set startup_timeout
      generously: the four stores each load their directory into memory and
      rechunkAll runs before listen(), so the port answers later than the
      process starts. Declare request concurrency explicitly and high — the
      standing 'no @modal.concurrent' invariant is about the synthesis and
      recognition apps, where the vendor holds a process-wide lock and
      configs/fast.json declares concurrency 1. It does not apply here and must
      not be carried over. A Modal function processes one input at a time unless
      told otherwise, and this container serves a browser UI in which a single
      synthesis request holds a streaming connection open for as long as
      GATEWAY_UPSTREAM_TIMEOUT_MS allows, 15 minutes by default. At concurrency
      1 that one request would block every asset load, every poll, and every
      other visitor, and the whole demo would present as hung. Node is
      single-threaded and non-blocking, so the concurrency ceiling here is about
      how many connections Modal will hand the container, not about parallel
      CPU. Set max_containers=1 and record why in a comment — each store is an
      authoritative in-memory Map over its directory, so two replicas over one
      Volume would each hold a stale index and last-write-wins would destroy
      work silently. Set min_containers=1 so a visitor does not pay a container
      start before the page renders. Make it environment-driven and allow 0:
      it is a posture choice, not a correctness bound like max_containers. The
      cost is ~$5-6/month at Modal's 0.125-core floor, inside the Starter plan's
      $30 credits, and worth about 87 minutes of H100 headroom a month. Set requires_proxy_auth=False deliberately, with
      the reason stated: proxy auth here would require a wk-/ws- pair in the
      browser, which is the exact thing the gateway exists to prevent. Volume
      writes commit in the background rather than synchronously, so state the
      window rather than implying durability on return: a write is durable at
      the next background commit, not when the gateway answers 200. Clips and
      staged references are expendable and can live with that. Voices are the
      one durable-by-design store, so the voice write path is where a commit is
      worth taking — either an explicit commit after a voice is written, or the
      window is documented in the runbook as a real if narrow way to lose a
      voice saved seconds before a restart. Do not scatter commits anywhere
      else."
    errors: The gateway process exiting → the container fails and Modal restarts it;
      a ConfigError already exits non-zero with a named remedy, so a bad Secret
      surfaces as a startup failure rather than a running service that 500s.
      Port never answering within startup_timeout → deploy fails loudly rather
      than serving a half-loaded store. A second container → cannot arise; it is
      prevented by configuration rather than defended against in code, because
      there is no in-process defence against a divergent index.
    tests: Modal objects are constructed and never called, as infra/tests already
      do. Assert max_containers is 1 and min_containers is 1. Assert declared
      request concurrency is greater than 1 on this app and remains 1 on the
      synthesis and recognition apps — the asymmetry is the whole point and a
      test is what stops the GPU invariant being copied onto a web server.
      Assert requires_proxy_auth is False on this app and unchanged (True) on
      the synthesis and recognition apps — the same shape of asymmetry, and the
      security decision. Assert the state Volume is not the weights Volume.
      Assert every store environment variable is an absolute path resolving
      beneath the mount, and that UI and findings paths are absolute and resolve
      into the image rather than the Volume.
  - slice: 4
    status: draft
    title: Password verification, sessions, and rate limiting
    purpose: Hold the three rules a one-password gate depends on, in pure modules
      that can be tested without a server.
    interface: verifyPassword(plain, hash) => Promise<boolean> in hash.ts. A
      SessionStore class with create() => id, verify(id, now) => boolean,
      destroy(id), and a sweep, taking an injected clock. A RateLimiter with
      check(key, now) => allowed and record(key, now). No Fastify import in any
      of the three, matching the separation cache-index.ts and voices-index.ts
      already keep from their filesystem halves.
    behavior: "Verify with Argon2id against a hash supplied as configuration; the
      plaintext is never present in the process. Compare in constant time.
      Session ids come from crypto.randomBytes at 32 bytes and are opaque — they
      encode nothing, so nothing can be read out of a stolen cookie beyond the
      fact of a session. Expiry is 60 minutes from creation, not from last
      activity: a fixed lifetime is the honest reading of 'the session lasts an
      hour', and sliding expiry would mean an open tab never expires. Take the
      clock as a constructor argument, as the rest of the gateway does, so
      expiry is tested rather than slept through. Sweep expired entries on
      access; the map is small and a timer would be a second thing to shut down.
      Rate limit login attempts on a fixed window keyed by a caller-supplied
      string, holding a count and a window start; evict a key when its window
      closes. The limiter takes the key and does not derive it — resolving a
      client address from behind a proxy is a Fastify concern and belongs in
      slice 5, and a pure module that reached for request.ip would be neither
      pure nor correct. Choose the window and threshold so a person who mistypes
      twice is unaffected and a script is stopped. Because the hosted deployment
      may collapse many visitors onto one key if address resolution fails, the
      threshold must be chosen so that a locked-out key is recoverable within a
      window a waiting person will tolerate, rather than a long ban that turns a
      shared bucket into an outage."
    errors: A malformed or absent hash → surfaced by configuration at startup as a
      ConfigError with a remedy, never at first login. Verification throwing →
      treated as a failed attempt and recorded as one; an Argon2 error must not
      become an open door. An unknown or expired session id → false, with no
      distinction between the two, since the difference is only useful to
      someone probing. Over the rate limit → refused without revealing whether
      the password was right, which would otherwise turn the limiter into an
      oracle.
    tests: A correct password verifies and a wrong one does not. Verification time
      does not vary with how much of the password is correct. A session is valid
      at 59 minutes and invalid at 61, driven by the injected clock. An unknown
      id and an expired id are indistinguishable in the return value. A
      destroyed session is immediately invalid. Attempts within the threshold
      are allowed and the next is refused. A key is evicted once its window
      closes, so the counter map does not grow with distinct sources over time.
      No module in this slice imports Fastify.
  - slice: 5
    status: draft
    title: The gate in front of every route that carries data
    purpose: Put the session in front of everything that reads or writes state, and
      add the one exchange that creates it — while still serving the inert shell
      that has to render the password field.
    interface: A Fastify plugin registered in createServer before the API routes and
      the static handler. POST /api/session {password} => 204 with Set-Cookie;
      DELETE /api/session => 204. An onRequest hook refusing every /api/* route
      but the login exchange without a valid session, and serving the static
      shell to anyone.
    behavior: "Read the session id from an HttpOnly, SameSite=Lax cookie, Secure
      whenever the gate is reachable over anything but loopback. Not a bearer
      token, and the reason is structural rather than preferential:
      VoiceWorkspace.tsx puts /api/voices/:id/audio into an <audio src>,
      History.tsx puts a clip URL into an <a download>, and ReferenceTrimmer.tsx
      does the same — browser-issued requests that cannot carry an Authorization
      header. SameSite=Lax rather than Strict so a link into the demo does not
      present as unauthenticated on first navigation. Gate every /api/* route.
      Exempt exactly two things and nothing else: POST /api/session, and the
      static shell — index.html, the hashed Vite bundle, and
      pcm-processor.js. The shell must be served to an unauthenticated visitor
      because the shell is what renders AccessGate; 401-ing it would mean the
      password field never loads and the visitor meets a bare Fastify error
      body. This is not a hole. The shell discloses nothing — the upstream URL
      and the proxy pair are absent from every bundled asset by standing
      invariant, and an unauthenticated console can complete no call, because
      every route behind it is gated. Serving the shell is also what lets slice
      6 hold a draft in memory across an expiry; a 401 on index.html would force
      a full page load and lose the work the gate exists not to lose. On refusal
      return 401 carrying the existing typed envelope with type 'auth', so the
      browser's error path stays one shape. Rate-limit the login route before
      verifying, so the limiter is not itself a way to spend Argon2 time. Set
      Fastify's trustProxy for the hosted mode and derive the limiter key from
      the resolved client address — see the errors below; this is the one
      decision that determines whether the limiter works at all. Register the
      plugin before both fastifyStatic and the API routes, since a hook
      registered after the route it guards guards nothing. When no password
      hash is configured, register nothing at all: that is what leaves the local
      demo untouched, and it is an explicit branch rather than an accident of
      empty configuration."
    errors: "Missing or malformed cookie on an /api/* route → 401 'auth'. Expired
      session → 401 'auth', identical in shape, so nothing distinguishes a stale
      session from a forged one. Wrong password → 401 with a message that says
      only that, and no indication of the password's length or shape. Over the
      rate limit → 429, with the same body shape and no hint about correctness.
      A request for the static shell without a session → served, deliberately,
      so the gate can render; every route it could call is still refused. A
      request for any other static path → the existing SPA fallback, which
      returns index.html and therefore discloses nothing either. Rate limiting
      behind Modal's proxy with trustProxy unset → request.ip is the proxy for
      every visitor, so all of them share one bucket and a single wrong-password
      loop locks out the whole demo; this is a denial of service produced by the
      control meant to prevent one. Trusting X-Forwarded-For unconditionally →
      the opposite failure, a limiter an attacker defeats by varying a header.
      Resolve it as configuration: trust the proxy only in hosted mode, take the
      RIGHT-most address in X-Forwarded-For, and fall back to the socket address
      when the header is absent. Right-most, not left-most: a client sends its
      own X-Forwarded-For and the proxy APPENDS to it, so the left-most entry is
      attacker-chosen and trusting it would defeat the limiter with a header.
      The right-most entry is the one the adjacent proxy observed and wrote
      itself, and is the only value in the chain nobody upstream of that proxy
      can choose. Resolve it in a pure function taking the socket address, the
      header and the mode, rather than through the framework's own trustProxy
      setting — the hop policy is the whole of the limiter's correctness and
      belongs somewhere it can be unit-tested."
    tests: "Over a real server instance: /api/health and /api/voices are refused
      without a session and served with one. / and /index.html are served
      without a session, and the response body contains no wk-/ws- token and no
      .modal.run URL — the shell being public is a decision, so the reason it is
      safe is asserted rather than assumed. POST /api/session with the right
      password sets a cookie with HttpOnly and SameSite, and Secure in hosted
      mode; with the wrong one it returns 401 and sets nothing. DELETE ends the
      session and the next request is refused. An expired session is refused,
      driven by the injected clock. Repeated wrong passwords produce 429. Two
      requests arriving with different X-Forwarded-For values are limited
      independently in hosted mode and are not separable in local mode, so the
      spoofing question is pinned in both directions. With no hash configured,
      every route behaves exactly as it does today and no cookie is ever set.
      The gate is registered before the API routes — asserted by requesting a
      gated route, not by reading the registration order."
  - slice: 6
    status: draft
    title: The access gate in the browser
    purpose: Ask for the password once, recover from an expiry without losing what
      the visitor was writing, and add no new way for the browser to learn about
      upstream.
    interface: An AccessGate component rendered by App.tsx ahead of the console.
      GatewayClient gains createSession(password) and endSession(). The existing
      typed 'auth' failure gains a central handler. Sequencing note - App.tsx
      and api/client.ts are also demo-ui slices 16, 19, 20, 22 and 23. The
      capability edge already puts demo-ui first; this slice must be written
      against the post-16-23 App.tsx, not the current one, or the draft-restore
      work here will be rewritten by slice 19's durable creation draft.
    behavior: "This component is why slice 5 serves the static shell to an
      unauthenticated visitor: the gate is React, so the bundle has to load
      before anyone can type a password, and it is also what holds the draft in
      memory across an expiry. Render a single password field and nothing else
      until a session exists; make no API call before submission, so an
      unauthenticated visitor's first request is the one they chose to make.
      SCOPE CORRECTION, found in implementation: that sentence holds of the
      AccessGate COMPONENT, not of the page load, and it cannot hold of the page
      load without breaking something else. The browser cannot know a gate
      exists before it asks. Slice 5 registers the gate only when a password
      hash is configured, precisely so the local demo is untouched, and the
      static shell carries no configuration by standing invariant — so nothing
      in the bundle can tell the two deployments apart. Remembering 'gate
      required' in browser storage would make a returning visitor WITH a live
      cookie retype their password on every load, which is the opposite of the
      point. What actually happens on a hosted first load: the console's own
      load calls are refused, the gate goes up, and from that moment no request
      is issued until the viewer submits. Closing the remaining gap needs a
      deliberate unauthenticated hint — a meta tag stamped into index.html at
      build time, or one exempt GET /api/gate — and is not worth it unless the
      four refused calls on a first hosted load ever become a real cost. The
      shell being served is not the console being shown — nothing behind the
      gate renders, and every route it could call is refused. Show failure in
      place beside the field — no toast, per the standing rules, which do not
      get an exception for being a login. Disable submit while a request is in
      flight rather than erroring on a double press. On any typed 'auth' failure
      from any call, return to the gate centrally in the client rather than at
      each call site. Before showing the gate, keep the console's draft state in
      memory and restore it after re-entry: an hour passing is not a reason to
      lose someone's work, and this is the one place an expiry could quietly do
      it. Restore the workspace the viewer was in, not the default. Keep every
      request relative — the gate is another same-origin /api call, and nothing
      here learns an upstream URL."
    errors: Wrong password → the field says so, in place, and keeps focus. Rate
      limited → the field says the attempts are limited and that waiting is the
      remedy, rather than repeating 'wrong password' at someone who may be
      typing it correctly. Network failure at the gate → distinguished from a
      rejection, since 'the demo is down' and 'you typed it wrong' have
      different remedies. An 'auth' failure mid-stream during playback →
      playback stops and the gate appears; the partial clip is not presented as
      complete.
    tests: The console does not render and no API call is made before a session
      exists. A wrong password shows the failure beside the field and renders no
      toast. A 401 from any client method returns the view to the gate. A draft
      typed before an expiry is present after re-entry, and the workspace is the
      one the viewer was in. Rate limiting and rejection produce different
      messages. No absolute URL appears in any request the component makes.
  - slice: 7
    status: draft
    title: Shared-workspace truth in Speak and Voices
    purpose: Make two facts of a shared workspace legible — that a 409 may be
      someone else, and that an undo may not be yours — without adding a
      live-update mechanism the demo does not have.
    interface: No API change. SpeakWorkspace distinguishes a busy state it caused
      from one it did not. VoiceWorkspace states the library is shared and
      withholds the undo strip for a disappearance it did not initiate.
      Sequencing note - state/voices.ts is also demo-ui slice 20, and
      SpeakWorkspace and VoiceWorkspace get their first tests in demo-ui slice
      21. Writing shared-workspace.test.tsx before 21 lands would mean this
      slice's tests are the only coverage those two components have, which
      inverts what 21 is for; the capability edge already orders demo-ui first
      and this slice depends on that being honoured rather than assumed.
    behavior: "The vendor holds a process-wide lock and returns 409 for every
      contended request, so the error carries no information about who holds it;
      the distinction must come from whether this client has a request in
      flight. When it does, keep today's wording exactly — the local demo must
      read as it always did. When it does not, present a waiting state naming
      that someone else is generating: the control disabled with the reason
      beside it, which is what the standing rules already say a busy state is.
      A waiting state that only waits would still lose the press that produced
      it, so the request this viewer made is held and retried when the lock is
      likely free, with bounded backoff and a bounded number of attempts. This
      is the smallest thing that makes the state honest: the standing rules say
      user work is never lost, and a press that produces a message and then
      nothing is lost work. It is a retry of one held request, not a queue and
      not a live channel — the viewer can cancel, the attempts are finite, and
      when they run out the state says so and leaves the composed request
      intact so a second press costs nothing but the press. For voices, show
      the undo strip only for a deletion this client performed,
      since the PendingUndo record lives in this client's state and the
      30-second window in voices-index.ts belongs to the deleter. A voice that
      vanishes from a refresh is simply absent — offering a button that cannot
      work would be worse than offering nothing. State once, in the voice
      library, that voices here are shared; place it where a first-time visitor
      reads it before creating something, not after losing something. Add no
      polling and no push. Refresh behaviour is unchanged, and the copy must not
      imply a liveness the demo does not have."
    errors: A 409 while this client has a request in flight → today's own-busy
      state, unchanged. A 409 with nothing in flight → the waiting state, with
      the request held and retried. Retries exhausted → the state says the
      demo stayed busy and the composed request is still there; it does not
      silently clear. A retry that succeeds → indistinguishable from a normal
      generation, because it is one. The viewer navigating away or cancelling →
      the held request is dropped and nothing retries in the background. A
      voice absent on refresh → removed from the list with no undo offered. A
      voice absent because this client deleted it → the existing undo strip for
      its 30 seconds. A delete that fails because another viewer already deleted
      it → the typed not-found is presented as already gone rather than as a
      failure, since the viewer's intent was satisfied.
    tests: A 409 with a request in flight renders the existing wording; a 409 with
      none renders the waiting state and disables the control. A held request
      retried after a 409 succeeds without the viewer pressing again, driven by
      an injected clock rather than a slept-through delay. Exhausted retries
      leave the composed request present and say so. Cancelling stops the
      retries. Neither renders a toast or a dialog. A voice removed by a refresh
      renders no undo
      affordance; a voice removed by this client's delete does, and it expires
      after the window. The shared-library statement is present in the voice
      library. A not-found on delete is presented as already gone. No polling
      interval and no EventSource is introduced by this slice.
  - slice: 8
    status: draft
    title: Wire the hosted deployment
    purpose: Make the hosted demo one documented sequence, and keep the local one
      true rather than quietly stale.
    interface: docs/runbooks/hosted-demo.md; a root npm script for the hosted deploy
      beside build/start/test; infra/hosting_deploy_check.py run after deploy, distinct from the build-time infra/hosting_smoke_check.py of slice 1 — a build-time check has no URL and a post-deploy check has no filesystem, so one file cannot be both.
    behavior: "Document the sequence end to end: build the UI, create the Argon2id
      hash and put it in a modal.Secret, deploy the hosting app, hand out the
      URL. State plainly that the operator generates the hash and never commits
      the plaintext. Cover the two operations the hosted demo actually needs:
      rotating the password, which means a new hash and a redeploy that also
      ends every session, and inspecting or clearing the state Volume. Answer
      explicitly what a restart does, because the two halves are opposite and it
      is the pair people get wrong — every session ends, and every saved voice
      survives. Re-verify docs/runbooks/local-demo.md and npm run setup against
      the changed configuration surface; local remains supported, so a runbook
      that has drifted is a defect this slice owns. The smoke check asserts,
      against the deployed URL: an unauthenticated request to an API route is
      refused; an unauthenticated request to the UI shell is served, because
      that is the deliberate exemption and an exemption nobody checks is an
      exemption that silently widens; the login exchange succeeds and sets a
      cookie; and no response body, header, or bundled asset contains the proxy
      pair or the .modal.run URL — the standing invariant, checked where it can
      actually be violated and checked hardest on the one surface served to
      strangers. The README gains a short hosted section saying plainly that it
      is one shared password over one shared workspace, that anything anyone
      uploads or saves is audible to everyone else holding the link, and that
      min_containers=1 keeps a resident CPU container at roughly $5-6/month.
      State the figure rather than warning vaguely: it sits inside the Starter
      plan's $30 of monthly credits and is no bill of its own, and the cost that
      matters is the ~87 minutes of H100 headroom a month it takes from the same
      budget. Name BREEZE_HOSTING_MIN_CONTAINERS=0 as the answer for a link that
      sits idle, and note max_containers is not adjustable the same way because
      that one is correctness."
    errors: The smoke check finding the credential or the upstream URL in any served
      byte → fail loudly and treat the deployment as compromised, since that is
      the invariant the whole architecture is built on. An unauthenticated
      request being served → fail; a gate that does not gate is worse than no
      gate, because it will be trusted. Login failing with a hash the operator
      just created → most likely a Secret that did not reach the container, so
      the check names that first rather than suggesting the password is wrong.
    tests: The smoke check is exercised against a locally started gateway with the
      gate enabled, so it is tested without a deployment. Assert it fails when
      given a response containing a wk- token, an ws- token, or a .modal.run
      URL, using fabricated responses — a check that has never failed is not
      known to work. Assert the documented deploy sequence names the same
      environment variables the hosting app reads, compared against
      infra/config.py rather than transcribed.
  - slice: 9
    status: draft
    title: Test the hosted deployment
    purpose: Cover the seams hosting creates, and close the two empirical unknowns
      this capability carries rather than shipping them as assumptions.
    interface: gateway/test/hosted-e2e.test.ts over a real server instance with the
      gate enabled; infra/tests/test_hosting_deploy.py over constructed Modal
      objects; bench/hosting_probe.py writing bench/findings/hosting.json, run
      deliberately against a deployment the way the other three probes are.
    behavior: "Exercise the gate end to end against a started server: an API route
      refused without a session and served with one, the static shell served
      without one, expiry refusing, rate limiting engaging. Include a test that
      authenticates the way an <audio src> does — a plain GET carrying only the
      cookie, no custom headers — because that is the constraint that chose
      cookies over tokens and a regression there is silent until someone presses
      play. Cover both configuration paths, loopback default and hosted
      override, since a default only one path exercises is a default that
      drifts. Then close the two unknowns with one probe against a deployment.
      The first is response streaming, and it is the one that matters most:
      this demo exists so the latency claim is heard rather than asserted, and
      if Modal's web proxy buffers a web_server response then the hosted demo
      silently becomes the buffered transport with no error anywhere and the
      whole point evaporates. Measure time to first audio byte through the
      hosted URL against total response time, exactly as the gateway's own
      streaming verification did locally (17ms first byte against 176ms total);
      a first-byte time that tracks the total is a buffering proxy. If it
      buffers, the remedy is already built — set GATEWAY_TRANSPORT=buffered for
      the hosted deployment and say so in the UI, because a demo that is honest
      about being slower is worth more than one that is quietly slower. The
      second is upload size: MAX_AUDIO_UPLOAD_BYTES is 512 MiB, chosen so a long
      reference is uploaded once, and whether Modal's web proxy passes a body
      that large is not known. Measure it, and if the proxy imposes a lower
      ceiling, lower the gateway's limit to match so an oversized upload is
      refused with a real number at the boundary instead of stalling. Record
      both the way bench records a finding. Keep the standing rule intact: no
      test in the suite needs a GPU, an external network, or a deployed
      service — the probe is a recorded measurement, like the bench probes, not
      a unit test."
    errors: A buffering proxy → not an error the code can raise, which is exactly why
      it needs a probe; it presents as a demo that works and underperforms, and
      an unmeasured streaming claim on the hosted URL is the one failure that
      would make the deployment worse than not shipping it. The proxy silently
      truncating a large body → the worst upload outcome, because it presents as
      a corrupt reference rather than a refusal; the probe must distinguish
      truncation from rejection and the finding must say which. A cookie not
      sent on a media request → treated as a blocking defect, not a nuisance,
      since it makes half the UI unusable while every fetch-based call still
      works. A test needing a deployed service → not accepted into the suite; it
      belongs in the probe.
    tests: "This slice is the tests. Its own bar: every assertion above runs without
      a GPU, a network, or a deployment, except the probe, which is a recorded
      measurement invoked deliberately and never part of npm test. The recorded
      finding names the observed first-byte and total times and whether the
      hosted path streams, plus the observed upload ceiling and whether the
      failure mode was refusal or truncation."
