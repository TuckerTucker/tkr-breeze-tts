capability: measurement
slice_specs:
  - title: Latency harness
    status: done
    purpose: Replace published H100 benchmark figures with numbers measured against
      this deployment.
    interface: "A CLI producing a results file: per-request time-to-first-audio,
      real-time factor, class (cold|warm), and warmup milliseconds on cold
      runs."
    behavior: "Issue authenticated requests to /v1/audio/speech, carrying the
      Modal-Key/Modal-Secret pair from the repo-root .env as request headers.
      Never measure through `modal curl`: it authenticates via local API
      credentials instead of proxy headers, and its own help states that
      API-based authentication adds latency and that it is for experimentation
      and debugging. It is a fine smoke test before the gateway exists and a
      false instrument afterwards — using it here would report Modal's auth
      round-trip as the model's time-to-first-audio. Record time-to-first-audio
      as the interval from send to first received PCM byte. Compute audio
      duration as bytes / 2 / 24000 exactly, and real-time factor as wall time
      over that duration. Force a cold class by idling beyond scaledown_window,
      or deterministically with `modal app stop`; classify subsequent immediate
      requests as warm. Scrape the vendor's warmup log line — `modal app logs`
      is where it surfaces — to decompose cold start."
    errors: A 409 → retried after a bounded wait rather than recorded as a latency
      sample, since it measures contention not speed. Auth failure → abort with
      the remedy named. A truncated stream → the sample is discarded rather than
      reported as a fast result.
    tests: Duration derivation is exact against a known byte count. Cold and warm
      samples are never merged. A forced 409 does not enter the sample set. The
      results file is written at a stable path. Requests carry Modal-Key and
      Modal-Secret headers, and no code path in the harness shells out to `modal
      curl`.
    slice: 1
    evidence:
      kind: commit
      ref: 183a1a0
  - title: CFG fall-off probe
    status: done
    purpose: Determine empirically whether an uncaptured cfg_scale leaves the
      CUDA-graph fast path, closing the plan's one open decision.
    interface: "A CLI producing a finding: time-to-first-audio per cfg_scale, plus a
      stated verdict on continuous-slider viability."
    behavior: Hold text, instruction, seed and container warm constant. Vary only
      cfg_scale across 1.0 and 4.0 (both captured in configs/fast.json under
      service.cfg_scales) and at least one uncaptured value such as 2.5. Repeat
      each enough times to distinguish a real difference from noise. Separately
      probe input length above the 512-token captured ceiling, which the same
      freeze_after_warmup mechanism governs. Write a finding stating the verdict
      with the numbers behind it.
    errors: A cold start mid-run → the sample is discarded, since cold start would
      swamp the effect. Insufficient separation between conditions → reported as
      inconclusive rather than resolved in either direction.
    tests: Captured and uncaptured cfg values are compared warm-only with repeats.
      The verdict is derived from the samples rather than asserted. The finding
      is written where the plan's open decision can cite it by path.
    slice: 2
    evidence:
      kind: commit
      ref: 183a1a0
  - slice: 3
    status: done
    title: Reference-duration ceiling probe
    purpose: Establish, by measurement, the longest reference audio the frozen
      backbone_prefill graphs will serve — so the trim control's maximum is
      observed rather than chosen.
    interface: "A CLI producing bench/findings/reference-ceiling.json: per-duration
      served/refused, the raised graph shape verbatim, and the ceiling per
      branch-batch mode."
    behavior: Generate reference WAVs of increasing duration at the model's own
      24kHz, holding text, instruction, seed and container warm constant so
      duration is the only varying quantity. Submit each at cfg 1.0 and at one
      cfg != 1.0, because backbone_prefill is keyed on branch_batch_size and a
      single figure would be wrong for one mode. Record the last duration that
      served and the first that raised. Capture the RuntimeError's graph shape
      verbatim rather than paraphrasing it — the shape is what identifies which
      frozen stage refused. Discard any sample whose request crossed a cold
      start, since that would attribute a container event to duration.
    errors: A 409 → retried after a bounded wait rather than recorded as a refusal,
      since contention is not a ceiling. A cold start mid-walk → affected
      samples discarded. An auth failure → abort with the remedy named, as the
      existing harness already does.
    tests: Generated reference durations are exact against a known byte count. A
      refusal is distinguished from a timeout and from a 409. The finding
      records a per-mode ceiling, never a single number. The finding is written
      at a stable path that the gateway's findings reader already resolves.
    evidence:
      kind: commit
      ref: 76fa942
