  - slice: 23
    status: draft
    title: Dormant Scripts correctness
    purpose: Make the Scripts gate a configuration change rather than a release of
      two untested defects.
    interface: exportScript's download mechanics and runCurrentScript's progress
      handling, both in the dormant Scripts path.
    behavior: "Append the export anchor to the document and let its object URL
