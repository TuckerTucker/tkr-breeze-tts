capability: demo-ui
slice_specs:
  - title: Console shell
    status: done
    purpose: Give the operator one surface where typing a line and hearing it takes
      a single action.
    interface: "The root view: text area, instruction field, vocal-event affordance,
      generate control, and a status region adjacent to that control."
    behavior: "Keep text and instruction always visible — both are needed in every
      mode. Offer vocal-event insertion at the caret, with the palette
      determined by a language selection: English parenthesis forms, or the
      Chinese bracket forms the vendor documents. Send no language parameter —
      the vendor API has none and the model infers language from the text, so
      the selection drives the palette only. Show length against the usable
      ceiling continuously as the operator types. Provide a seed control that is
      always visible, lockable, and rerollable, so a held seed isolates the
      effect of any other change. Keep the generate control disabled with a
      visible reason whenever the request cannot succeed. Persist the draft, the
      language selection and the seed state so a reload loses nothing."
    errors: Over-length input → surfaced while typing, never as a post-submit
      rejection. Gateway unreachable → generate disabled with that stated as the
      reason, rather than enabled into a failure. No toasts; status appears next
      to the action it concerns.
    tests: Generate is disabled with a reason on empty text and on an unreachable
      gateway. Vocal-event insertion places the marker at the caret, in the form
      matching the selected language. No language field appears in the outgoing
      request. A locked seed with identical inputs reproduces the same
      generation; reroll draws and displays a new one. The length indicator
      tracks input live. A reload restores draft, language and seed.
    slice: 1
    evidence:
      kind: commit
      ref: 3372dec
  - title: Voice modes
    status: done
    purpose: Make the model's three ways of specifying a voice legible and usable
      without documentation.
    interface: Mode selector over design | clone | direction, driving which fields
      render and which request shape is sent.
    behavior: "Design shows the instruction only. Clone and direction reveal
      reference intake and the exact-transcript field together, never one
      without the other, mirroring the vendor's both-or-neither rule so the
      invalid state cannot be expressed. Reference intake offers file upload
      (drop or pick) and microphone capture as peer options, neither framed as
      the other's fallback — an existing clean recording is usually the better
      reference and usually the one with a transcript to hand. Show an accepted
      file's name and duration. Direction adds a second instruction field — how
      the line should be delivered — on top of the reference. The CFG control is
      present in ALL THREE modes, not only direction: it is
      instruction-following strength everywhere (the vendor's own voice-design
      example runs at 4.0), and in the reference modes it is the dial between
      preserving the reference voice and following the instruction. It is
      therefore the only thing separating clone from direction, which share one
      template and one request shape. Render it as discrete presets at the
      captured 1.0 and 4.0 if the measurement finding shows an uncaptured value
      leaves the fast path, and as a continuous slider only if it does not.
      Preserve typed text across mode switches. Carry one line of in-place
      explanation per mode."
    errors: A non-audio or unreadable file → rejected at the point of drop with the
      reason shown, not on submit. An unavailable microphone → the capture
      control is disabled with the reason shown; upload is unaffected, since it
      was never the fallback. Reference without transcript, or transcript
      without reference → generate stays disabled naming the missing half, so an
      incomplete pair never wakes a GPU. A missing measurement finding → default
      to the conservative discrete presets rather than presenting a slider whose
      latency behaviour is unverified.
    tests: Each mode renders exactly its own field set, and direction shows both the
      reference and a delivery instruction. The CFG control appears in all three
      modes, labelled for what it does in each. Upload and capture are both
      present in clone and direction, and disabling the microphone leaves upload
      working. An accepted file shows name and duration. Reference and
      transcript always appear together, and generate stays disabled until both
      are present. Text survives a mode switch. The CFG control shape follows
      the recorded finding, and falls back to presets when no finding is
      present.
    slice: 2
    evidence:
      kind: commit
      ref: 3372dec
  - title: Streaming playback
    status: done
    purpose: Make the model's latency audible by playing audio before generation has
      finished.
    interface: A player accepting either a PCM stream or a WAV response, selected to
      match the gateway transport; reports measured first-audio time.
    behavior: In streaming mode, read the response body as a stream, convert s16le
      to float32, and feed an AudioWorklet through a ring buffer sized to absorb
      network jitter without adding perceptible delay. Begin playback on the
      first chunk. In buffered mode, play the returned WAV through a standard
      element. Record the interval from request send to first audible sample and
      display it once playback begins.
    errors: AudioWorklet unavailable or failing to start → fall back to buffered
      playback automatically, so the operator gets audio rather than silence.
      Buffer underrun → hold rather than emit a click, and resume when data
      arrives. Aborted stream → stop cleanly and report the clip as incomplete
      rather than leaving the player stuck.
    tests: Playback begins before the response completes, asserted on timing. No
      discontinuity at chunk boundaries in the produced samples. A forced
      worklet failure falls back and still produces audio. Reported first-audio
      time matches an independent measurement of the same request.
    slice: 3
    evidence:
      kind: commit
      ref: 3372dec
  - title: Wake state
    status: done
    purpose: Tell the truth about serverless cold start, so a slow first request
      reads as a waking container rather than a slow model.
    interface: A readiness indicator driven by gateway health, plus a distinct
      waking state during a cold request.
    behavior: Poll gateway health cheaply enough to know before submission whether
      the next request will be warm or cold, and show that. On a cold request,
      present a named waking state that is visually distinct from ordinary
      generation, carrying the expected duration from measured data and the warm
      latency that will follow. On completion, show the observed warm latency
      beside the earlier estimate. Show no wake state at all when warm. Render
      status in place, adjacent to the action — never a toast.
    errors: Health unavailable → report readiness as unknown rather than guessing
      warm, since a wrong warm claim is the one that misleads. A wake exceeding
      its estimate → keep the state and update the elapsed figure rather than
      switching to an indeterminate spinner. Missing measured data → say the
      duration is not yet measured rather than invent one.
    tests: A cold request renders the waking state and a warm request renders none.
      Readiness is visible before submission. With health unavailable, readiness
      is unknown, not warm. Expected and observed figures are both shown after a
      cold start.
    slice: 4
    evidence:
      kind: commit
      ref: 3372dec
  - title: Clip history
    status: done
    purpose: Let the operator compare and iterate on generations without
      regenerating them.
    interface: A history list backed by the gateway clip cache, with replay and
      load-into-console actions per entry.
    behavior: "List every generated clip with the settings that produced it visible
      without opening anything — mode, instruction, cfg value, seed, and
      measured first-audio time. Replay reads from the cache and reaches no GPU.
      Replay does not clear or reset the console, so an A/B comparison never
      destroys work in progress. Loading an entry populates the console with its
      settings, seed included, as the starting point for a variation. Offer
      promote-to-reference on any clip: switch to Clone, attach the clip as
      reference audio, and populate ref_text automatically from the text that
      produced it — the system already holds that text and the vendor requires
      the transcript to be exact, so asking the operator to retype it would be
      asking for work already done. Offer save-as-WAV on any clip and on the
      current player, served through the gateway's existing cache route and WAV
      wrapper, named from the text that produced it. Persist history across
      reload."
    errors: A cache entry missing on disk → shown as unavailable and removed from
      the list rather than failing playback silently. Cache unreachable →
      history renders read-only with the reason shown, rather than disappearing.
      Loading an entry never overwrites unsaved console text without the
      operator initiating it. A save of any clip → framed as WAV before
      delivery, since the cache holds raw PCM whatever the transport, and bytes
      nothing outside the demo can open are not a saved file. A promotion while
      in Design mode → switches to Clone rather than silently attaching a
      reference the current mode cannot send.
    tests: Every generation appears with its settings including seed. Replay reaches
      no upstream, asserted with upstream unreachable. Replay leaves console
      contents intact. Load-into-console populates every field of the original
      request, seed included. Promote-to-reference switches mode, attaches the
      clip, and fills ref_text from the originating text; generating afterwards
      carries the voice across. A promoted PCM clip is normalised to WAV on the
      way upstream. A saved file decodes as a valid 24kHz mono WAV and is named
      from its source text. History survives reload.
    slice: 5
    evidence:
      kind: commit
      ref: 3372dec
  - title: Voice library and picker
    status: done
    purpose: Make a voice something the operator picks by name, rather than
      something they rebuild from a clip each time.
    interface: A library panel listing saved voices with origin and default
      direction; a picker embedded in Clone and Direction reference intake;
      save-as-voice actions on the player and history entries.
    behavior: Offer saved voices as a third peer option beside upload and microphone
      capture wherever a reference is needed. Selecting a voice fills reference
      and transcript together from the store and never one alone. Show each
      voice's name, origin (designed from an instruction, or cloned from
      supplied audio) and default direction if it has one. Offer save-as-voice
      from the player and from any history entry, pre-filling the name from the
      instruction that produced the clip and leaving it editable in place.
      Deleting removes the voice immediately and offers an undo; no confirmation
      dialog. A selected voice survives switching between Clone and Direction,
      because the reference is identical in both.
    errors: An empty library → the option is present but explains that saving a clip
      is how voices get here, rather than being hidden. A voice whose audio the
      gateway reports unavailable → shown as unavailable and unselectable, with
      the reason, rather than selectable into a failed request. A save attempted
      on a clip no longer cached → the action is disabled with that stated. A
      duplicate name → accepted and disambiguated, never blocked mid-typing.
    tests: Clone and Direction each show three peer reference options. Selecting a
      voice populates reference and transcript together and enables generate.
      The selection survives a Clone/Direction switch. Save-as-voice pre-fills a
      name from the instruction and remains editable. Delete takes effect
      immediately and undo restores the voice. An empty library explains itself
      instead of hiding. An unavailable voice is not selectable.
    slice: 6
    evidence:
      kind: commit
      ref: 3372dec
  - title: Script editor
    status: done
    purpose: Make a multi-voice script something the operator edits line by line,
      where fixing one line costs one line.
    interface: "A cue list view: per-row text, assigned voice, state,
      target/actual/drift, and row actions; plus import drop target, run
      control, and export actions."
    behavior: Present the script as an ordered cue list — the list is the document.
      Each row carries editable text, a voice picked from the library, and its
      state (queued, generating, done, stale, drifted). Accept a dropped VTT or
      text file. Editing a row's text, voice, cfg or seed marks only that row
      stale and leaves every other row's audio intact. Running regenerates stale
      rows only. Where a row came from a timed VTT, show target, actual and
      drift together, and offer reroll, shorten, or accept — the three honest
      responses. Show whole-script progress during a run. Export to VTT with
      re-flowed real timings, and to one continuous audio file.
    errors: A malformed imported cue → surfaced as a named row that needs attention,
      not a silent drop and not a rejected file. A row whose voice was deleted
      from the library → marked unrunnable with the reason, and the run skips it
      rather than failing the script. Text beyond the model's ceiling → flagged
      on the row while typing, with run disabled for that row, never rejected
      after dispatch. Drift → always displayed; the UI offers no option that
      would stretch audio to fit, because that option does not exist.
    tests: A dropped VTT becomes an editable cue list carrying target timings;
      dropped plain text yields untimed rows with no fabricated timings. Editing
      one row marks only it stale. A re-run issues one GPU request for one stale
      row. Row state is visible in place for every row. Drift shows target,
      actual and difference. Deleting a voice used by a row marks that row
      unrunnable with the reason. Export produces a VTT whose timings match the
      generated audio.
    slice: 7
    evidence:
      kind: commit
      ref: 3372dec
  - slice: 8
    status: done
    title: Single bounded reference selection
    purpose: Let the operator move one measured, word-safe reference window across a
      recording and preview exactly what will be sent, without managing two
      endpoints or creating an invalid duration.
    interface: "`<ReferenceTrimmer reference maxSeconds maxMeasured cfgScale
      branchLimits tokenCeiling audioUrl onChange />`; reference state carries
      `{referenceId, start, end, transcript, transcriptEdited}`, while `start`
      is the user-controlled position and `end` is derived from the active
      bounded window."
    behavior: "Draw peaks at the container width and redraw on resize. Render one
      pointer- and keyboard-operable selection marker; dragging inside it
      preserves the pointer offset and moves the complete marker, while clicking
      outside recentres the same unit. Derive its maximum duration from the
      active branch measurement: 14.08 seconds at CFG 1.0 (`no_cfg`) and 28.16
      seconds above 1.0 (`single_cfg`). Clamp before state is emitted, then
      settle the whole interval on word boundaries and derive the transcript
      from fully contained words. Once hand-edited, the transcript remains
      operator-owned until restored. Preview only the selected gateway window.
      If evidence is unavailable, use the conservative fallback and label it
      unmeasured."
    errors: No ASR words means the same single bounded window remains movable on
      audio time and the transcript is empty and required with the ASR remedy in
      place. Malformed or missing measurement data selects the conservative
      fallback and says it is unmeasured. The UI never exposes independent
      endpoints, an over-duration state, a toast, or a post-submission duration
      error.
    tests: Pointer drag and keyboard movement move start and end together. Clicking
      outside recentres without changing the bounded duration. Word timing
      settles both edges and the transcript includes only fully contained words.
      CFG 1.0 resolves 14.08 seconds and CFG above 1.0 resolves 28.16 seconds. A
      hand edit survives movement and can be restored. Missing evidence uses and
      labels the conservative fallback. Reduced-motion and screen-reader
      behavior remain usable.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
  - slice: 9
    status: done
    title: Voice intent and workspace state
    purpose: Replace mode-driven UI state with task state that can move intact
      between active tools while retaining dormant script state.
    interface: "`VoiceSpec = {kind: 'described', instruction: string} | {kind:
      'referenced', reference: Reference, instruction: string}`. `WorkspaceState
      = {active: 'voices' | 'speak' | 'scripts', selectedVoiceId, speakDraft,
      lastScriptId}` persisted through an injected Storage adapter with a schema
      version and migration from the current draft/mode shape."
    behavior: Reference presence determines required controls and request shape. One
      instruction is stored and sent; CFG remains an independent
      strength/balance value. Derive legacy Design/Clone/Direction only when
      displaying provenance. Preserve selected voice, text, instruction, seed,
      active tool, and open script across navigation and reload. Migrate
      existing drafts without discarding typed text or a valid saved-voice
      selection.
    errors: An unavailable selected voice remains named but blocks generation with a
      contextual replacement action. Corrupt persisted state falls back
      field-by-field to safe defaults rather than discarding every valid field.
      A referenced spec cannot exist without both reference and transcript. No
      migration performs auto-correction of user text.
    tests: Exhaustive union tests cover described and referenced blockers, request
      projection, token ceilings, and CFG branches. Persistence round-trips
      every workspace field. Legacy drafts migrate without text loss. Corrupt
      fields fall back independently. No state transition can produce two
      authoritative instructions.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
  - slice: 10
    status: done
    title: Task navigation and processing feedback
    purpose: Make the app expose only available tools while keeping all work and
      processing state visible.
    interface: "`<WorkspaceNav active onSelect />` filters destinations through
      `WORKSPACE_AVAILABILITY`; Voices and Speak are active and Scripts is
      dormant. The app shell owns `Activity[]` through
      `trackActivity(label, operation)` and renders `<ActivityIndicator
      label={activitySummary(...)} />` whenever work remains."
    behavior: Switch tools in place and preserve their drafts; do not remount away
      unsaved state. Restore the persisted active tool at startup. Wrap every
      async path—workspace load, findings, reference stage/transcribe, generate,
      save/rename/delete, replay, script load/run, and export—with a stable
      activity id. The newest operation supplies copy and an additional-count
      suffix preserves overlap. Keep cold-start state distinct from ordinary
      processing.
    errors: A rejected operation removes only its own activity id and leaves a
      contextual error beside the originating control. One completion cannot
      hide another active operation. Navigation to a tool whose data failed to
      load still renders the tool with its inline remedy. No toast or blocking
      confirmation is introduced.
    tests: Pointer and keyboard navigation update the active workspace and preserve
      drafts. Reload restores it. Single and overlapping activities render
      accurate copy; completion and rejection remove only their owner.
      `aria-live`, reduced-motion CSS, focus visibility, and
      no-toast/no-confirmation rules are asserted.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
  - slice: 11
    status: done
    title: Voices workspace
    purpose: Combine voice creation and durable library management into one tool
      organised around the voice lifecycle.
    interface: "`<VoiceWorkspace voices clips creationDraft onCreate onSave onRename
      onDelete onUndo onUseInSpeak onUseInScript />`. Creation method is
      `'describe' | 'clone-audio' | 'from-clip'`; it is local progressive
      disclosure, not the speech request mode."
    behavior: Show the library first with Create voice as a contextual action.
      Describe asks for a voice description and auditions a generated clip
      before save. Clone audio accepts upload or recording, stages it once,
      exposes the single bounded transcript-following selection, and keeps
      audio/transcript inseparable. From clip selects an existing generated clip
      and preserves provenance. Suggest a name but allow direct editing. Rename
      in place; delete immediately with undo. Actions carry a selected voice
      into Speak or Scripts.
    errors: An unavailable ASR leaves clone creation usable with a required manual
      transcript and its remedy. A missing source clip prevents promotion and
      says it was evicted. Duplicate names are disambiguated by the gateway and
      reflected inline. Delete failure rolls the optimistic row back. No action
      loses the current creation draft.
    tests: Each creation method reveals only its inputs and produces the correct
      VoiceSpec. Reference selection stays bounded to 14.08/28.16 by active
      branch. Save, rename, delete/undo, provenance, and cross-tool actions are
      covered. Keyboard and screen-reader operation match pointer behavior.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
  - slice: 12
    status: done
    title: Speak workspace
    purpose: Make one-off synthesis a clear voice-plus-delivery task with exactly
      one instruction.
    interface: "`<SpeakWorkspace voiceSpec draft cfgControl readiness recentClips
      onGenerate onReplay onLoadVariation onSaveVoice />`. The typed client
      sends text, instruction, cfgScale, seed, and optional voice/reference
      identifiers; it does not require mode."
    behavior: "Order controls by decision: voice source, line, delivery, advanced
      CFG/seed, action, result. A described source needs no reference; a saved
      or staged source supplies the complete reference pair. Render one delivery
      instruction whose value is sent for every source. Use CFG copy to explain
      balance without creating a Direction mode. Keep recent clips visible for
      compare/replay/download/variation and promote; playback never resets the
      draft."
    errors: Missing reference transcript, over-ceiling text or reference, gateway
      unavailable, busy model, cold start, incomplete stream, and playback
      fallback each appear in context. Disable Generate with the remedy before
      dispatch wherever the state is knowable. A failed generation keeps all
      fields and selected voice.
    tests: Described and referenced sources project to the unified client contract.
      The visible instruction is exactly the sent instruction; no hidden
      direction field wins. Generate blockers, readiness/wake,
      replay-without-reset, variation, promotion, activity, stream failure, and
      accessibility are covered.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
  - slice: 13
    status: done
    title: Scripts workspace
    purpose: Implement the cue editor as a persistent document tool with common
      defaults and explicit exceptions; the active release keeps it dormant
      behind `WORKSPACE_AVAILABILITY`.
    interface: "`<ScriptsWorkspace summaries activeScript defaults voices onOpen
      onImport onUpdateDefaults onEditCue onRun onExport />`. Client additions:
      `scripts()`, `script(id)`, `updateScript(id, defaults)`, and cue patches
      carrying nullable overrides. Local workspace state persists
      `lastScriptId`."
    behavior: When enabled, load document summaries first and reopen the last script
      progressively. Show all local scripts without pagination. Import VTT or
      text into the same list. A defaults bar sets voice, one delivery
      instruction, CFG, and seed behavior; each cue displays inherited values
      and lets the operator create or clear overrides. Editing text or an
      effective setting marks only that cue stale. Run stale/failed cues only,
      maintain whole-script progress and row failures, show timing drift, and
      export real-timing VTT/WAV.
    errors: A missing last script falls back to the document list. A deleted voice
      marks inheriting or overridden cues that use it as needing attention
      without blocking unrelated cues. Load or run failure remains beside the
      document/row and preserves edits. Malformed imports name skipped blocks.
      No pagination, toast, silent reset, or audio time-stretching.
    tests: List/open/resume/import flows, last-script persistence, defaults and
      override precedence, clearing overrides, selective stale marking,
      progress/failure continuation, drift, and exports are covered. Existing
      one-edited-cue/one-request behavior remains pinned.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
  - slice: 14
    status: done
    title: Wire voice lifecycle workspaces
    purpose: Compose the new tools over shared state and injected services without
      duplicating domain rules.
    interface: "`AppProps` remains the IoC boundary for GatewayClient, AudioBackend,
      and Storage. App owns normalized workspace, voice, clip, script,
      readiness, activity, and failure state; workspaces receive typed props and
      callbacks. The client targets the completed local-gateway voice-intent
      contract before legacy mode is removed."
    behavior: Load health, clips, voices, and persisted workspace progressively;
      load script summaries only when Scripts is available. Keep data ownership
      in App or pure stores while
      each workspace remains a prop-driven view. Wire lifecycle actions through
      one state transition per action. Preserve global readiness/activity and
      local contextual errors. Apply responsive layout without full-page
      transitions for single actions.
    errors: One failed initial resource does not blank unrelated tools. A workspace
      action failure rolls back only its optimistic state and retains user
      input. Gateway compatibility is checked before sending the no-mode
      payload; final wiring does not ship against an incomplete voice-intent
      contract.
    tests: Composition tests inject fake client/audio/storage dependencies and
      traverse Voices → Speak → Scripts → clip promotion. Partial-load, failure
      rollback, reload restoration, readiness, and concurrent activity are
      covered without network or browser globals leaking into pure modules.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
  - slice: 15
    status: done
    title: Voice workspace interaction suite
    purpose: Verify the redesigned lifecycle as users experience it and prevent old
      mode-driven behavior from returning.
    interface: A JSDOM interaction suite plus targeted pure-state tests using
      injected client, audio, storage, and timer fakes.
    behavior: "Exercise complete user journeys, not isolated render snapshots:
      create a described voice, clone from a bounded reference, save/use it in
      Speak, promote a clip, open a script, apply defaults and one override,
      rerun stale-only, and reload into the same workspace."
    errors: The suite fails on any visible ignored instruction, loss across
      navigation/reload, unsupported 30-second claim, over-limit reference
      state, hidden concurrent processing, toast/confirmation use, inaccessible
      navigation, or unnecessary cue regeneration.
    tests: Cover Create/Keep/Use lifecycle, all three tools, described/referenced
      request parity, exact 14.08/28.16 limits, one movable selection, activity
      overlap/failure/reduced motion, contextual errors,
      keyboard/focus/screen-reader semantics, responsive layout, and existing
      streaming/cache behavior.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
  - slice: 16
    status: draft
    title: One audio owner
    purpose: Make exactly one audio source audible, so comparing two clips is a
      comparison rather than an overlap.
    interface: A single playback owner in App.tsx that both the streaming path and
      the cached-replay path route through, replacing the two independent refs
      that must currently remember each other.
    behavior: "Starting any playback stops whatever else is playing first, in both
      directions. Today playResponse awaits player.current?.stop() and
      replayClip pauses replay.current, and StreamingPlayer.stop() reaches only
      its own buffered element — so neither path can silence the other. Prefer
      one owner over cross-stopping at each call site: two handles that must
      remember each other is the shape that produced the defect, and a third
      playback entry point would reproduce it."
    errors: A stop that throws must not prevent the new playback from starting; the
      operator pressed Generate and is owed audio, not a failed stop. A replay
      whose element cannot start is already reported in place beside the
      control, and that stays.
    tests: Generate during a cached replay leaves only the generated clip audible.
      Replay during streaming playback leaves only the replay audible, and the
      streaming context is closed. A stop failure does not block the subsequent
      playback.
  - slice: 17
    status: draft
    title: Declared transport honoured
    purpose: Play at the rate and in the format the service declares, and make the
      fallback the code already promises actually happen.
    interface: StreamingPlayer.play, its private streaming and buffered paths, and
      the conversion helpers in audio/worklet.ts.
    behavior: "Read X-Sample-Rate and X-Sample-Format from the response and drive
      both the AudioContext and the conversion from them. Name 24000 and s16le
      once on the client, not a second time as a `?? '24000'` fallback —
      the codemap invariant exists because a wrong rate does not fail, it plays
      at the wrong speed. Treat a missing or unparseable rate as a transport
      failure with a stated reason, rather than letting NaN reach the
      AudioContext constructor and surface as an unexplained generation error.
      Treat a declared format the client cannot convert the same way. Make the
      catch in play() do what its own comment says — degrade to buffered audio —
      or correct the comment to describe the rethrow; the current pair is a
      promise the code does not keep. Release the AudioContext on every exit
      path, including the throwing one, instead of leaving it open until the
      next generation."
    errors: Missing or malformed rate or format → a named transport failure beside
      the control, never silence and never a wrong-speed clip. Worklet
      unavailable → buffered playback, reported as such in the readout, which
      already distinguishes the two paths.
    tests: A declared non-default rate builds a context at that rate. A missing rate
      header is reported rather than defaulted. A non-numeric rate never reaches
      the AudioContext constructor. A declared format that is not s16le is
      either converted correctly or refused with a reason. Every failure path
      closes the context.
  - slice: 18
    status: draft
    title: Deterministic capture release
    purpose: Ensure the microphone stops when the operator stops caring about it,
      not only when the recorder stops cleanly.
    interface: ReferenceCapture's recorder lifecycle, plus release of a staged
      reference the draft no longer holds.
    behavior: "Stop every track on the getUserMedia stream on unmount, on workspace
      change, and when MediaRecorder construction throws — today that only
      happens inside media.onstop, so an unmount mid-recording leaves the stream
      live and the browser's recording indicator on with nothing in the UI
      explaining it. Add the cleanup effect the component does not have. Call
      client.deleteReference, which currently has no caller anywhere, when a
      staged reference is replaced or discarded, so working material is released
      rather than waiting out the gateway's twenty-four hour expiry."
    errors: Permission denial and an unavailable microphone already report in place
      and keep upload available as a peer path; that is unchanged. A delete of
      an already-expired reference is not an error worth showing — the operator
      asked for it to be gone and it is gone.
    tests: Unmounting mid-recording stops every track. A throwing recorder
      construction releases the granted stream. Replacing a staged reference
      deletes the previous one. Upload validation and the staging-failure path
      keep their existing behaviour under the component's first dedicated suite.
  - slice: 19
    status: draft
    title: Durable voice-creation draft
    purpose: Stop losing the most expensive draft in the application to a reload.
    interface: The creation draft moves from component state in App.tsx into the
