capability: local-gateway
stories:
  - name: keep-the-token-off-the-client
    status: done
    number: 1
    actor: Operator
    intent: Use the demo in a browser without the Modal credential ever being
      present in something a page could read.
    preconditions:
      - A Modal proxy token pair exists
      - The service is deployed with proxy auth required
    trigger_action: The operator opens the demo and submits a synthesis request
    steps:
      - actor: Operator
        action: Opens the local demo page
        system_response: The page loads from the gateway's own origin; no Modal URL or
          token appears anywhere in it
      - actor: Operator
        action: Submits a request
        system_response: The gateway attaches the token server-side and forwards to
          Modal, returning audio to the page
    acceptance_criteria:
      - given: a request from the browser
        when: the gateway forwards it
        then: the token is attached server-side and appears in no response the browser
          receives
      - given: an inference already running
        when: a second request arrives and Modal returns 409
        then: the gateway returns a typed busy state the UI can render as disabled
          rather than as an error
      - given: a missing or invalid token
        when: the gateway starts
        then: it fails immediately naming the remedy, not at first synthesis
    feature: credential-proxy
    evidence:
      kind: commit
      ref: 69103a2
  - name: switch-playback-transport
    status: done
    number: 1
    actor: Operator
    intent: Move between streamed PCM and a buffered WAV with one setting, to
      compare them and to keep the demo working while the streaming path is
      still being built.
    preconditions:
      - The proxy forwards requests successfully
    trigger_action: The operator changes the transport setting and reloads
    steps:
      - actor: Operator
        action: Sets transport to buffered
        system_response: The gateway returns a complete WAV the browser can play with a
          standard element
      - actor: Operator
        action: Sets transport to streaming
        system_response: PCM is forwarded unbuffered and the page can begin playing
          before generation finishes
    acceptance_criteria:
      - given: buffered transport
        when: audio is returned
        then: it is a valid WAV whose header matches the upstream sample rate and format
          headers rather than hardcoded values
      - given: streaming transport
        when: the gateway forwards
        then: no buffering is introduced and bytes reach the client incrementally
      - given: either transport
        when: the browser makes a request
        then: the request contract is identical, so the switch is invisible to the
          caller
    feature: dual-transport
    evidence:
      kind: commit
      ref: 69103a2
  - name: record-a-reference-voice
    status: done
    number: 1
    actor: Operator
    intent: Clone a voice recorded in the browser without hand-converting an audio
      file or discovering the format was wrong only after the request failed.
    preconditions:
      - ffmpeg is installed locally
      - The operator can record or supply reference audio
    trigger_action: The operator records a reference clip and supplies its exact transcript
    steps:
      - actor: Operator
        action: Records a short reference clip in the browser
        system_response: The WebM/Opus capture is transcoded to WAV by the gateway
          before it is forwarded
      - actor: Operator
        action: Submits with the transcript filled in
        system_response: The pairing is validated locally and the clone request is forwarded
    acceptance_criteria:
      - given: browser-recorded WebM/Opus
        when: it reaches the gateway
        then: it is transcoded to WAV before forwarding, with no operator action
      - given: reference audio without a transcript, or a transcript without audio
        when: submission is attempted
        then: it is refused locally before the request leaves the machine, naming which
          half is missing
      - given: ffmpeg not installed
        when: the gateway starts
        then: it reports this with the install command, rather than failing on first use
    feature: reference-intake
    evidence:
      kind: commit
      ref: 69103a2
  - name: keep-every-clip
    status: done
    number: 1
    actor: Operator
    intent: Re-hear anything already generated instantly and for free, including
      while the GPU container is scaled to zero.
    preconditions:
      - At least one clip has been generated
    trigger_action: The operator replays a previously generated clip
    steps:
      - actor: System
        action: Writes audio to disk while streaming it to the browser
        system_response: The clip is cached without delaying playback
      - actor: Operator
        action: Replays that clip later
        system_response: It is served from disk, with no Modal request and no cold start
    acceptance_criteria:
      - given: a generation in streaming transport
        when: the gateway tees to disk
        then: the stream to the browser is not delayed by the write
      - given: a cached clip and a container scaled to zero
        when: the operator replays it
        then: playback is immediate and no GPU is woken
      - given: the cache at its configured size limit
        when: a new clip is written
        then: the oldest is evicted rather than growth continuing unbounded
    feature: clip-cache
    evidence:
      kind: commit
      ref: 69103a2
  - name: keep-a-named-voice
    status: done
    number: 1
    actor: Operator
    intent: Have a voice I made survive as a named thing I can reuse, rather than as
      a clip I have to find and re-promote each time.
    preconditions:
      - A clip has been generated, or reference audio has been supplied
    trigger_action: The operator saves a voice under a name
    steps:
      - actor: Operator
        action: Names and saves a voice from a generated clip
        system_response: The already-normalised WAV, its exact transcript, and the
          clip's provenance are stored under that name
      - actor: Operator
        action: Restarts the gateway and lists voices
        system_response: The voice is still there, independent of whether its source
          clip is still cached
      - actor: Operator
        action: Selects that voice for a new request
        system_response: Reference audio and transcript are both supplied from the store
    acceptance_criteria:
      - given: a saved voice made from a generated clip
        when: it is stored
        then: the clip's cached PCM is copied and framed as WAV from its sidecar — a
          container write, not a re-encode, and no second GPU request
      - given: a saved voice whose source clip has since been evicted from the clip
          cache
        when: the voice is used
        then: it still works, because a voice owns its own copy rather than pointing at
          a clip
      - given: a stored voice
        when: a request is built from it
        then: audio and transcript are supplied together, so the vendor's
          both-or-neither rule cannot be violated from the library
      - given: a gateway restart
        when: voices are listed
        then: every saved voice is present with its name and origin intact
    feature: voice-library
    evidence:
      kind: commit
      ref: 69103a2
  - name: run-a-script-cue-by-cue
    status: done
    number: 1
    actor: Operator
    intent: Voice a whole multi-line script in one run, with a different voice per
      line, without hand-firing a request per line.
    preconditions:
      - Voices exist in the library
      - A script of cues exists
    trigger_action: The operator runs the script
    steps:
      - actor: System
        action: Synthesises each cue as its own request with that cue's assigned voice
        system_response: Cues complete one at a time and progress is reported per cue
      - actor: System
        action: Reaches a cue whose text, voice, cfg and seed are unchanged since the
          last run
        system_response: It is served from cache and no GPU request is made
      - actor: Operator
        action: Exports the finished run
        system_response: A WebVTT is emitted carrying the durations actually generated
    acceptance_criteria:
      - given: a script with several different assigned voices
        when: it runs
        then: each cue is its own request, because the vendor API exposes no speaker
          field and one dialogue call is not available
      - given: the vendor's single-request lock
        when: the queue runs
        then: cues execute strictly one at a time and a 409 is never provoked
      - given: a re-run after one cue was edited
        when: the queue runs
        then: only the edited cue reaches the GPU and every other cue is served from
          cache
      - given: an exported VTT
        when: its timings are read
        then: they are the generated durations computed as bytes / 2 / 24000, never the
          imported targets
    feature: script-runner
    evidence:
      kind: commit
      ref: 69103a2
  - name: refuse-an-input-the-graphs-cannot-serve
    status: done
    number: 1
    actor: Operator
    intent: Be told a line is too long before a GPU is woken for it, and be told
      which line.
    preconditions:
      - The gateway is running
    trigger_action: The operator submits a request whose longest text segment
      exceeds its mode's ceiling
    steps:
      - actor: Operator
        action: Clones with a long reference transcript and a short line
        system_response: The request is refused naming the transcript, not the line, as
          the field over its ceiling
      - actor: Operator
        action: Clones at cfg 1.0 with a 400-token line
        system_response: It is accepted, because Clone reaches batch 2 even at cfg 1.0
          and so carries the 512 ceiling rather than 256
    acceptance_criteria:
      - given: a Clone request at cfg 1.0
        when: the ceiling is resolved
        then: it is 512, because two text segments reach batch 2 regardless of branch
          count
      - given: a short line and a long reference transcript
        when: the ceiling is checked
        then: the transcript is measured too and the largest segment decides, since the
          graph bucket is the padded maximum across the batch
      - given: a refusal
        when: the operator reads it
        then: it names which field was too long and the ceiling that field had
    feature: input-ceiling
    evidence:
      kind: commit
      ref: 17053ee
  - name: attach-a-recording-once-and-cut-from-it
    status: draft
    number: 1
    actor: Operator
    intent: Hand over a recording once and then work with sections of it, rather
      than re-uploading a file for every attempt.
    preconditions:
      - ffmpeg is available
      - The gateway is running
    trigger_action: The operator uploads or records reference audio
    steps:
      - actor: Operator
        action: Uploads a long recording
        system_response: One response carries its duration, its waveform peaks, and its
          transcript with per-word times
      - actor: Operator
        action: Chooses a window and generates
        system_response: The gateway trims to that window and sends the transcript
          covering exactly it
      - actor: Operator
        action: Generates a second line from the same reference
        system_response: Nothing is re-uploaded and nothing is re-transcribed
    acceptance_criteria:
      - given: a window between two times
        when: its transcript is needed
        then: it is sliced from word timestamps rather than obtained by transcribing
          again
      - given: a staged reference
        when: synthesis is requested
        then: the request carries an id and a window, not the audio
      - given: no ASR endpoint configured
        when: a reference is staged
        then: intake still succeeds with an empty transcript, degrading as a missing
          ffmpeg already does rather than failing
      - given: a staged reference that is never used
        when: its age passes the retention window
        then: it is evicted, and a voice promoted from it is unaffected because a voice
          owns its own copy
    feature: reference-staging
