capability: local-gateway
features:
  - name: credential-proxy
    status: done
    wiring_assignment:
      territory:
        - gateway/src/index.ts
        - gateway/package.json
        - gateway/tsconfig.json
    user_story: As the operator, I want the browser to talk only to localhost while
      the Modal token stays server-side, so that no credential is ever readable
      in page source and CORS never becomes a problem to solve.
    acceptance_criteria:
      - Modal-Key and Modal-Secret are read from the environment and attached
        server-side only.
      - No response to the browser contains the token or any part of it.
      - The gateway exposes its own routes for synthesis and health; the browser
        never learns the Modal URL.
      - The vendor's 409 becomes a typed busy response the UI can render as a
        disabled state.
      - A missing or rejected token fails at startup with a message naming the
        fix, not on the first synthesis attempt.
    scope_in:
      - Token custody, request forwarding, health passthrough, error typing.
      - Gateway configuration loading and startup validation.
    scope_out:
      - Transport selection between buffered and streaming (dual-transport).
      - Anything rendered in the browser (demo-ui).
    evidence:
      kind: commit
      ref: 69103a2
  - name: dual-transport
    status: done
    wiring_assignment:
      territory:
        - gateway/src/index.ts
        - gateway/package.json
        - gateway/tsconfig.json
    user_story: As the operator, I want to switch between streamed PCM and a
      buffered WAV with one setting, so that the demo stays usable while the
      streaming path is being made to behave, and so the two can be compared
      side by side.
    acceptance_criteria:
      - One configuration value selects buffered or streaming; no other change
        is required.
      - In buffered mode the gateway returns a valid WAV with a correct 24kHz
        mono 16-bit header.
      - In streaming mode PCM is forwarded without buffering and reaches the
        client incrementally.
      - Sample rate and format are taken from the upstream response headers, not
        hardcoded twice.
      - Switching modes does not change the request contract the browser uses.
    scope_in:
      - Both transport implementations behind one selector.
      - WAV header construction and unbuffered pass-through.
    scope_out:
      - Browser-side playback of either transport (demo-ui).
      - Caching (clip-cache).
    evidence:
      kind: commit
      ref: 69103a2
  - name: reference-intake
    status: done
    wiring_assignment:
      territory:
        - gateway/src/index.ts
        - gateway/package.json
        - gateway/tsconfig.json
    user_story: As the operator, I want to record a reference voice in the browser
      and have it just work for cloning, so that I never open a terminal to
      convert WebM to WAV or discover the format was wrong after a failed
      request.
    acceptance_criteria:
      - Browser-recorded WebM/Opus is transcoded to WAV via ffmpeg before
        forwarding.
      - Uploaded files in common containers (MP3, M4A, OGG, FLAC) are normalised
        to WAV; only an already-conforming WAV passes through untouched.
      - The ref_audio and ref_text both-or-neither rule is enforced locally,
        before the request leaves the machine.
      - A missing ffmpeg is reported at startup with the install command, not at
        first use.
      - An unsupported or non-audio file is rejected with its detected type
        named, before transcode.
    scope_in:
      - Transcode and normalisation pipeline for both recorded and uploaded
        reference audio.
      - Format detection and pairing validation.
      - Temporary file lifecycle and cleanup.
    scope_out:
      - Microphone capture in the browser (demo-ui).
      - Transcript accuracy — the operator supplies ref_text; the model requires
        it to be exact.
    evidence:
      kind: commit
      ref: 69103a2
  - name: clip-cache
    status: done
    wiring_assignment:
      territory:
        - gateway/src/index.ts
        - gateway/package.json
        - gateway/tsconfig.json
    user_story: As the operator, I want every generated clip kept on disk
      automatically, so that re-hearing something I already made is instant and
      free rather than a second GPU request.
    acceptance_criteria:
      - Generated audio is written to disk while streaming, without delaying the
        stream to the client.
      - The on-disk format is the same whichever transport is active — raw PCM
        beside a sidecar carrying rate and format — and WAV framing happens at
        read.
      - A replayed clip is served from disk as a buffered read regardless of the
        active transport.
      - Each cached clip records the request that produced it — text,
        instruction, mode, cfg_scale, seed.
      - A cache read never reaches Modal, so replay works while the container is
        scaled to zero.
      - Cache growth is bounded by a configured limit with oldest-first eviction.
    scope_in:
      - Tee-to-disk during streaming, replay path, request metadata, eviction.
      - Cache index and lookup.
    scope_out:
      - History presentation and re-audition UI (demo-ui).
      - Transport selection (dual-transport).
    evidence:
      kind: commit
      ref: 69103a2
  - name: voice-library
    status: done
    wiring_assignment:
      territory:
        - gateway/src/index.ts
        - gateway/package.json
        - gateway/tsconfig.json
    user_story: As the operator, I want the voices I make kept as named, reusable
      entries, so that using one again is picking it from a list rather than
      hunting through clip history and promoting a clip every time.
    acceptance_criteria:
      - A voice is stored as its reference audio, the exact transcript, and an
        optional default direction, under a name the operator chooses.
      - Voices persist across gateway restarts and are listed independently of
        clip history — deleting a clip never removes a voice made from it.
      - "Saving a voice from a generated clip copies that clip's cached PCM and
        frames it as WAV: a container write, not a re-encode, and no second GPU
        call."
      - Selecting a stored voice supplies both halves of the vendor's required
        audio+transcript pair, so a request from the library can never be
        half-formed.
      - A voice records what it came from — designed from an instruction, or
        cloned from supplied audio — so its origin survives the naming.
    scope_in:
      - "The voice store: create, list, rename, delete, and read for request
        construction."
      - Reuse of the reference-intake normalisation so every stored voice is a
        conforming WAV.
      - "Provenance: the instruction, seed, or source clip a voice came from."
    scope_out:
      - Browsing and selecting voices in the browser (demo-ui voice-picker).
      - Clip caching, which stores generations rather than voices (clip-cache).
      - Any server-side notion of a voice on Modal — the model has no
        saved-voice primitive; this store is entirely local.
    evidence:
      kind: commit
      ref: 69103a2
  - name: script-runner
    status: done
    wiring_assignment:
      territory:
        - gateway/src/index.ts
        - gateway/package.json
        - gateway/tsconfig.json
    user_story: As the operator, I want a whole script voiced cue by cue, so that a
      multi-line piece with different voices is one queued run rather than forty
      manual requests.
    acceptance_criteria:
      - WebVTT is parsed into cues — index, target timing, and text — and plain
        text is accepted as untimed cues.
      - Each cue is synthesised as its own request with its own assigned voice,
        because the vendor API exposes no speaker field and cannot voice a
        multi-character script in one call.
      - Cues run one at a time, matching the vendor's single-request lock, with
        per-cue progress reported.
      - Each cue is cached under a key covering its text, voice, cfg and seed —
        so re-running a script only regenerates what changed.
      - Export emits WebVTT carrying the durations actually generated, computed
        exactly as bytes / 2 / 24000, never the imported targets.
    scope_in:
      - VTT parse and emit; plain-text intake as untimed cues.
      - "The cue queue: sequential execution, per-cue status, resumable after
        failure."
      - Per-cue cache keying and reuse; drift measurement against any imported
        target timing.
      - Concatenating cue audio into one continuous track on request.
    scope_out:
      - The script editing surface (demo-ui script-editor).
      - Voice storage (voice-library); the runner reads voices, it does not own
        them.
      - Any time-stretching or pitch correction to force audio into a target
        duration — explicitly rejected.
    evidence:
      kind: commit
      ref: 69103a2
  - name: input-ceiling
    status: done
    wiring_assignment:
      territory:
        - gateway/src/index.ts
        - gateway/src/script.ts
    user_story: As the operator, I want every string that becomes a text-encoder
      segment measured against the ceiling its own branch mode carries, so that
      a request the frozen graphs cannot serve is refused here rather than
      aborted mid-stream on the GPU.
    acceptance_criteria:
      - "The ceiling is keyed on (mode, cfg), not cfg alone: Design at 1.0 is a
        single text segment at batch 1 and caps at 256; Clone and Direction
        carry two segments and reach batch 2 even at cfg 1.0, so they cap at
        512."
      - Every string sent is measured — text, instruction, and the reference
        transcript — and the largest decides, because the graph bucket is the
        padded maximum across the batch and one long segment sets it for every
        row.
      - A refusal names which field was too long and what its ceiling is, so the
        operator is not left to guess which box to shorten.
      - The estimate stays conservative for text that is not English, since a
        four-characters-per-token rule is an English average and being
        optimistic costs a hard failure rather than a warning.
    scope_in:
      - The ceiling table, the estimator, and the refusal that carries both.
    scope_out:
      - Showing the count as the operator types (demo-ui).
      - Reference duration, which the backbone governs rather than the text
        encoder (measurement).
    evidence:
      kind: commit
      ref: 17053ee
  - name: reference-staging
    status: done
    wiring_assignment:
      territory:
        - gateway/src/index.ts
        - gateway/src/config.ts
    user_story: As the operator, I want a reference uploaded once and held with its
      waveform and its timed transcript, so that choosing a section of it costs
      no re-upload, no second transcription, and no chance of the transcript
      drifting from the audio it describes.
    acceptance_criteria:
      - A reference is uploaded once and referred to by id thereafter; the
        console stops re-sending the whole file on every synthesis.
      - Normalisation, waveform peaks and transcription happen on intake, so the
        browser receives everything it needs to draw and cut in one response.
      - A window is expressed as a start and an end; the gateway trims with
        ffmpeg at send time and sends the transcript that window actually
        covers.
      - The transcript for a window is sliced from word timestamps rather than
        re-transcribed, so dragging a handle costs nothing.
      - Microphone capture routes through the same intake, so recording and
        upload stop being two paths.
      - When no ASR endpoint is configured the intake still works and the
        transcript is simply empty, degrading exactly as a missing ffmpeg
        already does.
    scope_in:
      - The staged reference store, its intake, its window preview, and its
        eviction.
      - The ASR proxy, with the credential attached server-side as every other
        upstream call already is.
      - Peak computation and transcript slicing as pure functions, so their
        rules are testable without a filesystem.
    scope_out:
      - Running the recogniser (modal-inference speech-recognition).
      - Drawing the waveform or dragging the handles (demo-ui).
      - The voice library, which keeps its own copy and outlives any staged
        reference.
    evidence:
      kind: manual
      ref: Gateway build and typecheck passed; 183 gateway tests passed on 2026-09-01.
  - name: voice-intent-contract
    status: done
    wiring_assignment:
      territory:
        - gateway/src/index.ts
        - gateway/src/config.ts
        - gateway/package.json
        - gateway/tsconfig.json
    user_story: As the operator, I want one voice-and-delivery contract to drive
      both Speak and Scripts, so that the gateway—not a UI mode label—decides
      which vendor request is valid and every script cue preserves the delivery
      settings I can see.
    acceptance_criteria:
      - A synthesis intent is described or referenced solely by the presence of
        a complete reference; mode is derived metadata and is not authoritative
        input.
      - Every intent has one instruction field. A reference plus neutral
        instruction is cloning; a reference plus directed instruction and CFG is
        directed delivery through the same vendor template.
      - Library and staged references are resolved before request shape, input
        ceiling, cache provenance, and vendor template are selected.
      - Script records persist default voice, instruction, CFG, and seed
        behavior, with explicit per-cue overrides.
      - Effective cue settings are resolved through the same voice-intent
        function as one-off synthesis.
      - Changing a script default marks only cues that inherit that value stale;
        explicit cue overrides remain unchanged.
      - Cue cache identity includes every effective setting, including
        instruction, so visible changes cannot replay stale audio.
      - Existing scripts and requests migrate to conservative defaults without
        losing cached clips or cue text.
    scope_in:
      - A pure voice-intent resolver shared by speech and script request
        construction.
      - Script document defaults and per-cue instruction/voice/CFG/seed
        overrides persisted in the existing script store.
      - Speech and script API validation, migration, provenance, cache identity,
        and tests.
    scope_out:
      - Any new vendor endpoint or change to the two vendor templates.
      - UI layout and navigation (demo-ui voice-workspaces).
      - A new store; existing script, voice, reference, and clip stores retain
        their current lifecycles.
    continues:
      - local-gateway/feature/credential-proxy
      - local-gateway/feature/voice-library
      - local-gateway/feature/script-runner
      - local-gateway/feature/input-ceiling
    evidence:
      kind: manual
      ref: Gateway build and typecheck passed; 183 gateway tests passed on 2026-09-01.
