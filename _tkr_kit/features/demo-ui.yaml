capability: demo-ui
features:
  - name: synthesis-console
    status: done
    wiring_assignment:
      territory:
        - ui/src/App.tsx
        - ui/src/main.tsx
        - ui/package.json
        - ui/tsconfig.json
    user_story: As the operator, I want one clear surface to type what should be
      said and press go, so that trying an idea takes one action rather than a
      tour of settings.
    acceptance_criteria:
      - Text and instruction entry are always visible; nothing essential hides
        behind a menu.
      - Vocal events such as (laugh) and (sigh) are insertable without
        memorising the syntax.
      - Input length is shown against the model's usable ceiling as the operator
        types, not rejected on submit.
      - Submit is disabled with a visible reason when the request cannot succeed
        — never enabled into an error.
      - Work in progress persists across reload; nothing typed is lost.
    scope_in:
      - Console layout, text and instruction entry, vocal-event affordance,
        submission state.
      - Draft persistence and length feedback.
    scope_out:
      - Mode-specific fields such as reference audio (voice-modes).
      - Playback and history (streaming-playback, clip-history).
    evidence:
      kind: commit
      ref: 3372dec
  - name: voice-modes
    status: done
    wiring_assignment:
      territory:
        - ui/src/App.tsx
        - ui/src/main.tsx
        - ui/package.json
        - ui/tsconfig.json
    user_story: As the operator, I want the model's three request behaviors
      represented without invalid field combinations, so later task-oriented
      workspaces can project them safely.
    acceptance_criteria:
      - The completed mode components represent design, clone, and direction
        request shapes; the active release supersedes their top-level selector
        with task-oriented workspaces and availability gates.
      - Choosing clone or direction reveals reference intake and the
        exact-transcript field together, never one alone.
      - Reference intake offers file upload and microphone capture as peer
        options — upload is a first-class path, not a fallback for a missing
        microphone.
      - The CFG control matches the measured fall-off finding — discrete presets
        if a continuous slider leaves the fast path.
      - Switching modes preserves the text already written.
      - Each mode explains in one line what it does, in place, without a help
        modal.
    scope_in:
      - Mode selection, per-mode field sets, CFG control.
      - "Reference intake affordance: file drop/pick and microphone capture,
        with accepted-file feedback."
      - In-place explanation of each mode.
    scope_out:
      - Transcoding and format normalisation of reference audio (local-gateway).
      - Deciding whether the slider is viable — that is the measurement finding.
    evidence:
      kind: commit
      ref: 3372dec
  - name: streaming-playback
    status: done
    wiring_assignment:
      territory:
        - ui/src/App.tsx
        - ui/src/main.tsx
        - ui/package.json
        - ui/tsconfig.json
    user_story: As the operator, I want audio to start playing while it is still
      being generated, so that the model's low-latency claim is something I hear
      rather than something I am told.
    acceptance_criteria:
      - Streaming mode plays PCM as it arrives through an AudioWorklet, starting
        before generation completes.
      - Incoming s16le samples are converted and buffered without audible gaps
        or clicks at chunk boundaries.
      - Buffered mode plays the returned WAV through a standard element,
        matching the gateway setting.
      - Measured time-to-first-audio for the current clip is displayed after
        playback begins.
      - A worklet failure falls back to buffered playback rather than leaving
        the operator with silence.
    scope_in:
      - AudioWorklet pipeline, ring buffer, format conversion, fallback path.
      - Per-clip time-to-first-audio display.
    scope_out:
      - Producing either transport (local-gateway).
      - Benchmark measurement runs (measurement).
    evidence:
      kind: commit
      ref: 3372dec
  - name: wake-state
    status: done
    wiring_assignment:
      territory:
        - ui/src/App.tsx
        - ui/src/main.tsx
        - ui/package.json
        - ui/tsconfig.json
    user_story: As the operator, I want to be told plainly when the GPU is waking
      rather than watching an unexplained spinner, so that a cold start reads as
      a known cost of serverless rather than as the model being slow.
    acceptance_criteria:
      - A cold start is shown as a distinct, named state — not the same
        indicator as normal generation.
      - The wake state shows expected duration from measured data and the warm
        latency that follows it.
      - Warm requests show no wake state at all.
      - The operator can tell, before submitting, whether the next request will
        be warm or cold.
      - No toast is used; status appears in place, contextual to the action.
    scope_in:
      - Wake state detection via gateway health, its presentation, and readiness
        indication.
      - Displaying measured cold and warm figures together.
    scope_out:
      - Setting the scaledown window (modal-inference).
      - Producing the measurements (measurement).
    evidence:
      kind: commit
      ref: 3372dec
  - name: clip-history
    status: done
    wiring_assignment:
      territory:
        - ui/src/App.tsx
        - ui/src/main.tsx
        - ui/package.json
        - ui/tsconfig.json
    user_story: As the operator, I want everything I have generated kept and
      re-playable, so that comparing two voices or two cfg values is a click
      rather than a regeneration.
    acceptance_criteria:
      - Every generated clip appears in a session history with the settings that
        produced it.
      - Replaying a clip is instant and does not reach the GPU.
      - Two clips can be compared without losing either — the console is not
        reset by playback.
      - History survives reload.
      - A clip can be reloaded into the console as the starting point for a
        variation.
    scope_in:
      - History list, replay, reload-into-console, persistence across reload.
      - Showing the settings behind each clip.
    scope_out:
      - Disk caching and eviction (local-gateway).
      - Playback mechanics (streaming-playback).
    evidence:
      kind: commit
      ref: 3372dec
  - name: voice-picker
    status: done
    wiring_assignment:
      territory:
        - ui/src/App.tsx
        - ui/src/main.tsx
        - ui/package.json
        - ui/tsconfig.json
    user_story: As the operator, I want to pick a saved voice in Clone or Direction,
      so that reusing a voice I already made is one action instead of supplying
      audio and a transcript again.
    acceptance_criteria:
      - Clone and Direction offer saved voices as a third peer option alongside
        upload and microphone capture.
      - Selecting a saved voice fills reference and transcript together and
        cannot leave the pair half-filled.
      - A generated clip can be named and saved to the library from the player
        or from history.
      - Each voice shows what it came from — designed from an instruction, or
        cloned from supplied audio — so the library is legible months later.
      - Deleting a voice happens immediately with an undo, never a confirmation
        dialog.
    scope_in:
      - "The library surface: browse, select, name, rename, delete with undo."
      - Save-as-voice from the player and from clip history.
      - Showing each voice's origin and its default direction if it has one.
    scope_out:
      - Persisting voices to disk (local-gateway voice-library).
      - Reference transcoding and normalisation (local-gateway reference-intake).
    evidence:
      kind: commit
      ref: 3372dec
  - name: script-editor
    status: done
    wiring_assignment:
      territory:
        - ui/src/App.tsx
        - ui/src/main.tsx
        - ui/package.json
        - ui/tsconfig.json
    user_story: As the operator, I want to write or import a script as a list of
      lines, assign a voice to each, and fix one line without redoing the rest,
      so that producing a multi-voice piece is editing rather than re-running.
    acceptance_criteria:
      - A script is a list of cues; each cue carries its text, an assigned voice
        from the library, and its state.
      - A VTT or plain-text file can be dropped in and becomes an editable cue
        list.
      - Editing one cue marks only that cue stale — every other cue keeps its
        generated audio and replays from cache.
      - Where a cue came from a timed VTT, the generated duration is shown
        against the target with the drift, and the operator can reroll, shorten
        the text, or accept.
      - The script can be exported as WebVTT with real generated timings, and as
        one continuous audio file.
    scope_in:
      - "The cue list as the document: add, edit, reorder, delete, assign a
        voice per cue."
      - Import by drop; export to VTT and to a single audio file.
      - Per-cue state — queued, generating, done, stale, drifted — and
        whole-script progress.
      - Drift presentation against imported target timings.
    scope_out:
      - Parsing and emitting VTT, and running the queue (local-gateway
        script-runner).
      - Voice storage and naming (voice-library / voice-picker).
    evidence:
      kind: commit
      ref: 3372dec
  - name: reference-trimmer
    status: done
    wiring_assignment:
      territory:
        - ui/src/App.tsx
        - ui/src/components/VoiceModes.tsx
    user_story: As the operator, I want one duration-bounded selection to move
      across a recording while its words follow, so that I can choose the
      strongest usable reference without managing two endpoints or creating an
      over-limit window.
    acceptance_criteria:
      - The waveform and transcript are shown together, and one selection marker
        moves both as a unit.
      - The selection duration is derived from the active measured ceiling, so
        independently movable start and end handles cannot construct an
        over-limit request.
      - The complete window settles on word-safe boundaries, so its transcript
        never claims a partially selected word.
      - The transcript remains editable for recognition errors, and a hand edit
        is remembered rather than overwritten by later movement.
      - The selected window can be played before it is used.
      - "The maximum changes with the active inference branch: 14.08 seconds at
        CFG 1.0 and 28.16 seconds above 1.0 from the recorded measurement; 30
        seconds is not presented as a supported maximum."
      - When measured evidence is unavailable, the control uses the conservative
        fallback and identifies it as unmeasured.
    scope_in:
      - The waveform, single movable selection marker, window playback, and
        transcript that follows the selected words.
      - Branch-specific duration and token readouts that prevent an unservable
        request before submission.
    scope_out:
      - Transcription and trim-at-send (local-gateway reference-staging).
      - Saving a trimmed reference as a voice, which belongs to the voice
        lifecycle workspace.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
  - name: voice-workspaces
    status: done
    wiring_assignment:
      territory:
        - ui/src/App.tsx
        - ui/src/main.tsx
        - ui/src/styles.css
        - ui/package.json
        - ui/tsconfig.json
    user_story: As the operator, I want the active app organised around creating
      voices and speaking with saved voices, with completed script production
      kept dormant until its product gate is enabled, so that I never have to
      translate the model terms Design, Clone, and Direction into the task I am
      trying to finish.
    acceptance_criteria:
      - The active primary navigation is Voices and Speak; the completed Scripts
        workspace is removed from navigation by `WORKSPACE_AVAILABILITY`.
      - Voices owns creation and library management, with creation methods
        Describe, Clone audio, and Create from a generated clip.
      - Speak owns one-off generation with a saved voice, one delivery
        instruction, text, CFG, seed, playback, and recent clips; described and
        staged sources are disabled by `SPEAK_VOICE_SOURCE_AVAILABILITY`.
      - Scripts remains a completed persistent workspace that lists, opens,
        imports, and resumes documents when its centralized gate is enabled.
      - "The voice lifecycle is visible through contextual actions: Save to
        Library, Use in Speak, Use in Script, and Create voice from clip."
      - Clone remains a voice-creation method, not a lifecycle stage; Use
        includes both one-off Speak and Scripts.
      - Described and referenced voices are the only request shapes. The request
        shape is derived from whether a reference exists, while direction
        remains one instruction plus CFG.
      - Only one instruction field is authoritative in each generation context;
        no visible field can be ignored because another hidden or mode-specific
        field wins.
      - Script-level voice and delivery defaults can be overridden per cue, and
        editing one cue still reruns only that cue.
      - All asynchronous processing has contextual, accessible in-place activity
        feedback, including overlapping background work; there are no toasts or
        confirmation dialogs.
      - Drafts, selected voice, active workspace, and open script survive
        workspace switches and reloads.
    scope_in:
      - Task-based navigation and persistent workspace state for Voices and
        Speak, plus retained dormant state for Scripts.
      - Voice creation and management flows, one-off synthesis, clip promotion,
        and script document reopening.
      - A shared voice selector, one delivery-instruction model, CFG/seed
        controls, and contextual activity/error states.
      - Script defaults with per-cue overrides, stale-only execution, progress,
        drift, and export in a dedicated workspace.
    scope_out:
      - Changing the model or its two vendor request templates.
      - Remote accounts, sharing, collaboration, or multi-user libraries.
      - Replacing the gateway voice, clip, reference, or script stores; this
        feature consumes their existing APIs and adds only missing client
        access.
      - Treating Clone or Direction as primary navigation destinations.
    continues:
      - demo-ui/feature/synthesis-console
      - demo-ui/feature/voice-modes
      - demo-ui/feature/clip-history
      - demo-ui/feature/voice-picker
      - demo-ui/feature/script-editor
    dependencies:
      local-gateway/feature/voice-intent-contract: Speak and Scripts consume the
        unified request shape, persisted script defaults, and cue overrides
        before final UI wiring.
    evidence:
      kind: manual
      ref: UI production build and typecheck passed; 194 UI tests and desktop/mobile
        browser QA passed with a clean console on 2026-09-01.
