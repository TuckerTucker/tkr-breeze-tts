meta:
  fmt: 14
  name: breeze-tts-demo
  ts: "2026-09-07T00:54:35Z"
  what: "A local demo of Breeze-TTS-2 (3B EN/ZH TTS). GPU inference serverless on
    Modal; a local gateway holds the credential and absorbs audio chores; a browser
    UI plays 24kHz PCM as it arrives, so the latency claim is heard, not asserted."
  langs: [python, typescript, tsx]
  runtimes: { node: "20.19", python: "3.12" }
  cmds:
    install: "npm run install:all"
    setup: "npm run setup"
    build: "npm run build"
    start: "npm start"
    test: "npm test && npm run test:python"
    deploy: "modal run infra/weights.py && modal deploy infra/service.py"
    measure: ".venv/bin/python -m bench.harness && .venv/bin/python -m bench.cfg_probe && .venv/bin/python -m bench.reference_probe"

capabilities:
  - id: modal-inference
    state: done
    dir: infra/
    evidence: "commit d4b5f0c; deployed and serving on an H100"
    provides: "Modal image, weights Volume, warm serving class, deployment config,
      build-time warmup-profile extension"
    verified: "68 tests; image built, flash-attn ABI check passed, 7.68GB on the Volume"
  - id: measurement
    state: done
    dir: bench/
    evidence: "commit 183a1a0; findings recorded from real hardware"
    provides: "first-audio + RTF harness; cfg fast-path fall-off and reference-ceiling probes"
    verified: "66 tests; all three probes run against the deployed endpoint"
  - id: local-gateway
    state: done
    dir: gateway/
    evidence: "commits a01edea, b1c07c0, f47e742"
    provides: "credential proxy, dual transport, staged reference + ASR proxy, trim-at-send, clip cache, voice library, script runner, prompt-capacity enforcement, guided setup walkthrough"
    verified: "220 tests + real ffmpeg intake, injected ASR/upstream boundaries, and a scripted setup run"
  - id: demo-ui
    state: done
    dir: ui/
    evidence: "commits f4a188c, defd083, 4b0ae90"
    provides: "saved-voice-focused console, capability-gated workspaces, streaming playback, wake state, history, voice library, script editor and cached cue preview"
    verified: "240 tests over the shipped configuration + a lint gate; the
      mode-era dead surface is retired and the saved-voice path is asserted
      end to end. Real AudioWorklet last driven in Chrome before slices 16-23 —
      a fresh browser pass is owed."
  - id: hosted-deployment
    state: done
    dir: "infra/hosting*.py, gateway/src/auth/, ui/src/components/AccessGate.tsx"
    evidence: "9/9 slices; DEPLOYED 2026-09-06 and verified end to end"
    provides: "Modal-hosted gateway on a Volume behind one shared Argon2id password"
    verified: "5/5 post-deploy checks pass against the live URL. Modal's proxy
      STREAMS (warm, 592ms first byte of a 3768ms response, ratio 0.16) and
      passes 512 MiB intact — bench/findings/hosting.json."

state:
  built:
    - "All five capabilities' source and tests: 715 tests (180 python, 295
       gateway, 240 ui), all passing without a GPU, external network, or deployed
       service. `npm run check` runs typecheck + lint + every suite."
    - "DEPLOYED. Image built, 7.68GB checkpoint on the Volume, service live at an
       operator-held endpoint, proxy auth enforced."
    - "Measured on an H100: warm TTFA 161ms, RTF 0.39, graph-capture warmup 162.6s
       over 69 graphs, cold start ~170s. Published claims are <40ms and 0.32;
       the operator has accepted the measured times."
    - "Described and referenced request shapes both work across the continuous CFG
       control after the warmup extension; delivery is one instruction on either."
    - "Gateway verified end to end: streaming first byte 17ms vs 176ms total;
       replay served from cache with the upstream killed; 409 typed as busy."
    - "UI verified in Chrome: real AudioWorklet, 19ms first audio, no fallback."
    - "Reference audio is staged and transcribed once; one bounded selection moves
       as a unit and is trimmed only at send."
    - "Gateway preflight models text-encoder and backbone-prefill graph families
       independently, including reference-audio codes; oversized plain-text script
       lines are split at natural boundaries before they can reach a frozen graph."
    - "The active browser surface is Voices and Speak with saved voices; Scripts,
       described-voice and temporary-reference are built but gated dormant."
    - "`npm run setup` (gateway/src/setup/) takes a bare machine to a running
       demo: each phase detects its own done state, the proxy pair comes from the
       Modal CLI or a validated paste, URLs are read through the Modal SDK, .env is
       edited in place owner-only. Resume path verified against real tools."
    - "A UI review (2026-09-06) is recorded as plan, not code: demo-ui slices
       16-23 and hosted-deployment's 9 slices. demo-ui reads 15/23 slices done."
  deferred:
    - "Cold TTFA is unmeasured client-side; the figure is known from container
       logs only, so the UI's wake state says 'not yet measured'."
    - "bench/findings/latency.json predates the warmup extension — its warmup_ms
       is the pre-extension 148.6s; current 162.6s/69-graph figures are in
       docs/audits/2026-08-31-cfg-branch-batch.md. The UI uses the valid warm
       TTFA/RTF and leaves client-observed cold TTFA null."
    - "HOSTED AND LIVE at breeze-tts-gateway. The gate refuses every /api/*
       without a session, serves the shell without one, and leaks neither the
       proxy pair nor the upstream URL. Re-run `npm run check:hosted <url>`
       after any redeploy — it is the check that would notice the exemption
       widening."
    - "A cold sample cannot answer the streaming question. The GPU's ~150s start
       makes first-byte track total at ratio 0.98, which is exactly what a
       buffering proxy looks like — the first probe run nearly recorded that as
       the verdict. bench/hosting_probe.py now warms first and ands `streams`
       with `warm`."
    - "Voices and scripts still accumulate without bound, now cited in
       .claude/rules/compliance-triage.md against PIPEDA Sch1-4.5 and Alberta
       PIPA s-35. Hosting does not create the leak; it removes the only thing
       that was bounding it, which was one person's disk and restraint."
  do_not_assume:
    - "cfg is NOT graph-keyed. warmup_profile.py maps it to a binary mode, so a
       continuous slider is viable for both described and referenced request
       shapes after the batch-4 extension. The retired brief says otherwise."
    - "Text encoding and backbone prefill are separate frozen graph families.
       At cfg 1.0 the assembled backbone prompt is capped at 256 even when Clone's
       two text segments reach text-encoder batch 2; above cfg 1.0 it is 512.
       Reference audio contributes 12.5 tokens/second. Exceeding either is a hard
       failure, not a slowdown."
    - "The measured reference ceiling is 14.08 seconds at cfg 1.0 and 28.16
       seconds above cfg 1.0. There is no supported 30-second branch."
    - "The vendor's fast.json does NOT warm ref_edit_tata — its warmup_request is
       hardcoded to tts_instruction. infra/extend_warmup_profile.py patches in the
       batch-4 text-encoder graphs at build time; without that step Clone and
       Direction raise at any cfg != 1.0. Do not drop it on a vendor bump."
    - "The vendor runtime is NOT in this repo. It is cloned into the image at a
       pinned commit (infra/image.py VENDOR_COMMIT); nothing here imports it locally."
    - "Koji is ON as of 2026-09-06 (enabled for the compliance corpus; project
       registered, kit stamp 0.1.0 -> 0.2.0). Planning state is STILL
       file-canonical in _tkr_kit/ — Koji holds the statute corpus, not the plan.
       `tkr koji disable` reverts the services; the corpus payload in
       _tkr_kit/corpus/ is what makes the index rebuildable."
    - "The UI test totals NOW measure what ships (slices 20-21). The four
       importer-less mode-era components and their 63 tests are retired;
       VoiceWorkspace and SpeakWorkspace have their own suites; the shipped
       saved-voice request path is asserted end to end through the real gates.
       Gate overrides fell from 11 to 3, and each survivor is named
       'dormant capability - ...' so an override is a declaration, not a habit.
       A lint gate (ui/eslint.config.js + ts-unused-exports) now fails on an
       unused export, which is what stops the dead surface growing back."
    - "The UI now has ONE audio owner (slice 16). player.ts exports a
       PlaybackOwner holding a single Audible; App holds one owner ref, and every
       entry point silences the previous source before starting. Generate during
       a cached replay replaces it rather than overlapping."
    - "The client now KEEPS the sample-rate invariant (slice 17). worklet.ts
       parseDeclaredTransport refuses a missing, non-numeric or out-of-range
       rate and an unconvertible format before any AudioContext exists; 24000
       is named nowhere in ui/src. What slice 17 also found: the buffered
       fallback was handing raw PCM to an <audio> element with no WAV header,
       so it produced SILENCE, and the swallowed decode error meant the whole
       jsdom suite was green over it. wavFromPcm frames it now."

invariants:
  - "The Modal credential never leaves the gateway process. No response body,
     header, log line, or bundled asset may contain the pair or the .modal.run URL."
  - "The browser issues only same-origin relative /api/* requests. It never learns
     the upstream endpoint, which is what makes CORS a non-problem rather than a
     configured one."
  - "The clip cache holds exactly ONE on-disk format — raw PCM s16le plus a sidecar.
     WAV framing happens at read, never at write, so a clip's readability never
     depends on which transport was active when it was generated."
  - "Sample rate and format come from upstream X-Sample-Rate / X-Sample-Format.
     Never hardcode 24000 or s16le a second time: a wrong rate does not fail, it
     plays at the wrong speed."
  - "No @modal.concurrent ON THE GPU APPS. The vendor holds a process-wide
     _request_lock and returns 409; configs/fast.json declares concurrency 1.
     This is about inference, not about Modal — the planned hosting app must
     declare concurrency HIGH, since a web server at 1 lets one streaming
     synthesis block every asset and every other visitor."
  - "The model load lives in @modal.enter(), never the ASGI lifespan. Modal marks a
     container warm when enter() returns."
  - "Readiness is inferred from idle time, never polled. GET /health on a
     scaled-to-zero container starts one."
  - "The AudioWorklet processor is served from ui/public/ untransformed, and its
     AudioContext runs at the model's own sample rate."
  - "No time-stretch, ever. Script drift is measured and reported, never corrected."
  - "No language field is sent. The vendor API has none; the selector drives the
     vocal-event palette only."
  - "Staged references are expiring working material, separate from generated clips
     and durable voices. A reference selection is trimmed at send time and must fit
     the measured ceiling for its CFG branch."
  - "UX: no toasts, no confirmation dialogs, undo over 'are you sure?', status in
     place beside the control it concerns."

deps:
  gateway: { runtime: [fastify, "@fastify/multipart", "@fastify/static", pino], dev: [typescript, tsx, vitest] }
  ui: { runtime: [react, react-dom], dev: [vite, vitest, jsdom, "@testing-library/react", typescript] }
  python: { infra: ["modal>=0.64", "huggingface-hub>=0.26", "structlog"], bench: ["httpx>=0.27", "structlog"] }
  external: { ffmpeg: "required for reference intake; checked at startup, degrades to WAV-only uploads" }

struct:
  infra:     { n: 12, lines: 1802, tests: 5, role: "Modal deployment surface" }
  bench:     { n: 5,  lines: 2144, tests: 3, role: "measurement clients + findings/" }
  gateway/src: { n: 23, lines: 8061, tests: 16, role: "local Node service + guided setup" }
  ui/src:    { n: 32, lines: 7260, tests: 16, role: "React browser surface" }
  # tests: = test files only; helpers, fixtures and conftest are excluded
  ui/public: { n: 1, role: "pcm-processor.js — served untransformed, deliberately not bundled" }

nav:
  read_first: [docs/models/architecture.md, README.md,
               docs/audits/2026-08-31-cfg-branch-batch.md]
  entry_points:
    modal: infra/service.py
    gateway: gateway/src/index.ts
    setup: gateway/src/setup/main.ts
    ui: ui/src/main.tsx
  data_flow: "browser → gateway/src/index.ts → proxy.ts → Modal → vendor FastAPI →
    PCM stream → tee to cache.ts + pipe to ui/src/audio/player.ts → AudioWorklet;
    reference upload → ASR proxy + staged WAV/transcript → bounded trim at speech send;
    plain-text script → text-chunker.ts → capacity-safe cues → cached cue preview"
  pure_logic: [gateway/src/cache-index.ts, gateway/src/voices-index.ts,
               gateway/src/reference-slice.ts, gateway/src/text-chunker.ts,
               gateway/src/vtt.ts, ui/src/state/]

api:
  gateway:
    health:  ["GET /api/health", "POST /api/wake", "GET /api/findings"]
    speech:  ["POST /api/speech"]
    references: ["POST /api/reference", "GET /api/reference/:id/audio",
                 "DELETE /api/reference/:id"]
    clips:   ["GET /api/clips", "GET /api/clips/:id", "DELETE /api/clips/:id"]
    voices:  ["GET /api/voices", "POST /api/voices", "PATCH /api/voices/:id",
              "DELETE /api/voices/:id", "GET /api/voices/:id/audio"]
    scripts: ["POST /api/scripts", "GET /api/scripts", "GET /api/scripts/:id",
              "PATCH /api/scripts/:id",
              "PATCH /api/scripts/:id/cues/:cueId", "PUT /api/scripts/:id/cues",
              "DELETE /api/scripts/:id", "POST /api/scripts/:id/run (SSE)",
              "GET /api/scripts/:id/export.vtt", "GET /api/scripts/:id/export.wav"]
  upstream_vendor: ["GET /health", "POST /v1/audio/speech (multipart → raw PCM stream)"]
  error_types: [busy, auth, timeout, upstream, unavailable, validation, format, reference, not-found]

config:
  env_file: ".env at the repo root — one copy, because the gateway and bench
    authenticate to the same endpoint (.env.example is the template)"
  gateway: [MODAL_ENDPOINT_URL, MODAL_ASR_URL, MODAL_KEY, MODAL_SECRET, GATEWAY_PORT, GATEWAY_TRANSPORT,
            GATEWAY_SCALEDOWN_WINDOW_S, GATEWAY_UPSTREAM_TIMEOUT_MS,
            CLIP_CACHE_DIR, CLIP_CACHE_MAX_BYTES, VOICE_STORE_DIR, SCRIPT_STORE_DIR,
            REFERENCE_STORE_DIR, REFERENCE_MAX_AGE_MS, BENCH_FINDINGS_DIR, UI_DIST_DIR,
            LOG_LEVEL]
  modal: [BREEZE_GPU, BREEZE_PIN_GPU, BREEZE_SCALEDOWN_WINDOW_S, BREEZE_MIN_CONTAINERS,
          BREEZE_TIMEOUT_S, BREEZE_REQUIRES_PROXY_AUTH,
          "BREEZE_ASR_* — 7 more, same shape, for the recognition app",
          "BREEZE_HOSTING_MIN_CONTAINERS (0 scales the hosted gateway to zero;
           default 1 costs ~87 min of H100 headroom/month), _CONCURRENCY,
           _STARTUP_TIMEOUT_S, _TIMEOUT_S — the hosting app"]
  defaults: { port: 8787, transport: streaming, gpu: "H100!", scaledown_s: 600, cache_max: 2GiB }
  tokens: "MODAL_KEY/MODAL_SECRET are proxy tokens (wk-/ws-). An ak-/as- API token
    authenticates to nothing here and is refused at startup by both the gateway and bench."

relations:
  - "infra/config.py is the single decoration-time surface; image.py, weights.py and
     service.py all read it and none carries its own decorator arguments."
  - "bench writes findings/ → gateway reads them → UI renders them. The UI never
     computes a latency figure it did not observe or read."
  - "Clips and voices have separate lifetimes: clips evict oldest-first, voices own
     their own copy of the audio and survive their source clip."
  - "Staged references have a third lifecycle: upload and ASR happen once, the WAV
     and timed transcript expire together, and each request trims the selected window."
  - "A script cue's clipId hashes text+voice+instruction+cfg+seed (the neutral
     instruction keeps its legacy identity), so staleness is derived, not tracked."
  - "Plain-text imports use dispatch's prompt-capacity rule; generated cues preview
     only their cached WAV and never synthesize on playback."

testing:
  totals: { infra: 68, bench: 66, gateway: 220, ui: 194, all: 548 }
  runners: { python: pytest, gateway: vitest, ui: "vitest + jsdom + testing-library" }
  principle: "No test needs a GPU, external network, or deployed service — the
    Modal SDK is only constructed and upstream boundaries are injected."
  real_io: "Three gateway abort tests bind ephemeral 127.0.0.1 sockets to exercise
    post-header failures. Reference intake uses real ffmpeg fixtures; container
    detection against a fabricated header would pass while the real thing failed."

arch:
  boundaries:
    - "browser ↔ gateway: same-origin HTTP only"
    - "gateway ↔ Modal: proxy-auth headers, attached server-side only"
    - "pure index/parse modules carry no filesystem access, so their rules are testable alone"
  patterns: [inversion-of-control, injected-transport, injected-clock, derived-state]
  logging: { python: structlog, node: pino }

ops:
  scripts: { root: ["install:all", setup, build, start, test, "test:python", typecheck] }
  gitignored: [.env, .cache/, node_modules/, dist/, .venv/]

semantic:
  ~cold_start: "The full 7.7GB weight load and 69-graph capture, ~170s in container
    logs, paid again after every gap > scaledown_window. Client-side, unmeasured."
  ~flash_attn: "Mandatory on every path, including the one documented as eager —
    config.json pins it on the text encoder, which the eager arg never reaches."
  ~cfg_scale: "The most interesting control and the least documented. It is the
    ONLY thing separating clone from direction — which is exactly why the
    batch-4 failure removes Direction rather than degrading it."
  ~no_saved_voice: "The model has no voice primitive — no embedding, no id. A voice
    can only persist as reference audio plus its exact transcript, entirely locally."
  ~one_request_per_cue: "Forced, not chosen: the served API exposes no speaker
    field and templates.py hardcodes S0."
