# Wave-preflight declarations, read by the `credentials-preflight` start gate.
#
# Credential home for this project is `.env` at the repo root, not the kit vault.
# The vault (global:tkr3d) remains the model-router's home for OPENAI_API_KEY;
# it is not where Modal credentials live. The gate still requires that vault to be
# openable without a prompt — that is a property of the gate, not a claim about
# where secrets are kept — so keychain stay-authenticated or TKR_VAULT_PASSWORD
# is still needed for a run to start.
#
# Probes are content-free by contract: argv plus an expected exit 0. Never put a
# credential value in this file — it is committed, and the loader rejects
# secret-shaped strings.

probes:
  # Assert the Modal proxy auth pair is present and correctly shaped, without
  # reading, printing, or sourcing its values. `wk-` is the proxy key prefix and
  # `ws-` the proxy secret prefix; API tokens (`ak-`/`as-`) are a different thing
  # and would authenticate to nothing here, so the prefix is the check worth making.
  #
  # grep rather than `. ./.env`: sourcing executes whatever is in the file, and a
  # readiness probe should not be a code path.
  - name: modal-proxy-token
    command:
      - bash
      - -c
      - 'grep -qE "^MODAL_KEY=wk-" .env && grep -qE "^MODAL_SECRET=ws-" .env'
    timeoutMs: 5000

  # Do not add an authenticated health probe to routine preflight. The service is
  # deployed, but an authenticated GET /health wakes a scaled-to-zero GPU and
  # would pay the model-load and graph-capture cost on every wave. Gateway startup
  # instead sends an unauthenticated request: Modal rejects it at the edge without
  # waking the container, proving reachability and proxy-auth enforcement. Token
  # validity is exercised only by a deliberate wake or synthesis.
  #
  # - name: modal-endpoint-auth
  #   command:
  #     - bash
  #     - -c
  #     - 'set -a; . ./.env; set +a; curl -fsS -o /dev/null
  #        -H "Modal-Key: $MODAL_KEY" -H "Modal-Secret: $MODAL_SECRET"
  #        "$MODAL_ENDPOINT_URL/health"'
  #   timeoutMs: 30000

# The `tests` gate's substantiveness floor. The repository currently has 134
# Python, 183 gateway, and 194 UI tests, so a zero-test pass is never acceptable.
minTests: 1
