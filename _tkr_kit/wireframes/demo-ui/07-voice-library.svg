<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Voice library — saved voices as a reference source</title>
<desc id="d">The voice library: saved voices offered as a third peer option beside upload and microphone capture, each showing its origin, with the selected voice filling both halves of the required audio+transcript pair.</desc>
<g class="atom-region" data-region="chrome">
<rect x="0" y="0" width="1280" height="800" fill="#FFFFFF" />
<rect x="880" y="64" width="400" height="736" fill="#F5F5F5" />
<text x="48" y="40" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#000000">Breeze TTS 2</text>
<circle cx="824" cy="34" r="4" fill="#000000" />
<text x="840" y="38" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">GPU WARM / READY</text>
<line x1="0" y1="64" x2="1280" y2="64" stroke="#000000" stroke-width="1" />
<line x1="880" y1="64" x2="880" y2="800" stroke="#E0E0E0" stroke-width="1" />
</g>
<g class="atom-region" data-region="mode">
<rect x="48" y="112" width="320" height="48" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
<rect x="160" y="112" width="112" height="48" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />
<line x1="160" y1="112" x2="160" y2="160" stroke="#E0E0E0" stroke-width="1" />
<line x1="272" y1="112" x2="272" y2="160" stroke="#E0E0E0" stroke-width="1" />
<text x="64" y="142" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Design</text>
<text x="176" y="142" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">Clone</text>
<text x="288" y="142" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Direction</text>
<text x="48" y="96" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">VOICE MODE</text>
<text x="48" y="184" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">A VOICE IS REFERENCE AUDIO PLUS ITS EXACT TRANSCRIPT. THE MODEL STORES NEITHER.</text>
</g>
<g class="atom-region" data-region="ways">
<text x="48" y="216" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">REFERENCE VOICE / THREE PEER OPTIONS</text>
<rect x="48" y="232" width="256" height="72" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />
<rect x="312" y="232" width="256" height="72" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
<rect x="576" y="232" width="256" height="72" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
<text x="64" y="266" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">Saved voices</text>
<text x="64" y="288" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">04 IN LIBRARY</text>
<text x="328" y="266" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Upload a file</text>
<text x="328" y="288" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">MP3 / M4A / WAV / FLAC</text>
<text x="592" y="266" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Record</text>
<text x="592" y="288" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">FROM MICROPHONE</text>
</g>
<g class="atom-region" data-region="lib">
<text x="48" y="336" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">YOUR VOICES / KEPT LOCALLY, NOT ON THE GPU</text>
<line x1="48" y1="352" x2="832" y2="352" stroke="#E0E0E0" stroke-width="1" />
