<text x="104" y="380" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">Narrator — calm</text>
<text x="368" y="380" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DESIGNED / A WARM, THOUGHTFUL YOUNG WOMAN</text>
<text x="760" y="380" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">SELECTED</text>
<text x="64" y="432" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">02</text>
<text x="104" y="436" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">Urgent announcer</text>
<text x="368" y="436" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DIRECTED / SAME VOICE, URGENT AND CLIPPED</text>
<text x="776" y="436" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DELETE</text>
<text x="64" y="488" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">03</text>
<text x="104" y="492" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">Sam — recorded</text>
<text x="368" y="492" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">CLONED / FROM UPLOADED AUDIO</text>
<text x="776" y="492" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DELETE</text>
<text x="64" y="544" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">04</text>
<text x="104" y="548" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">Reader — bright</text>
<text x="368" y="548" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DESIGNED / CRISP, LIGHT, QUICK TO THE POINT</text>
<text x="776" y="548" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DELETE</text>
</g>
<g class="atom-region" data-region="sel">
<text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">SELECTED VOICE FILLS BOTH HALVES OF THE REQUIRED PAIR</text>
<rect x="48" y="624" width="784" height="64" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
<text x="64" y="652" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">narrator-calm.wav</text>
<text x="288" y="652" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">0:12 / 24 KHZ MONO</text>
<text x="64" y="676" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">TRANSCRIPT: “IT IS GOOD TO HEAR YOUR VOICE AGAIN.”</text>
<line x1="48" y1="712" x2="832" y2="712" stroke="#E0E0E0" stroke-width="1" />
