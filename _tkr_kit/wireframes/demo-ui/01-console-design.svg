<text x="64" y="142" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">Design</text>
<text x="176" y="142" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Clone</text>
<text x="288" y="142" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Direction</text>
<text x="48" y="96" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">VOICE MODE</text>
<text x="48" y="184" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DESCRIBE A VOICE IN WORDS. NO REFERENCE AUDIO NEEDED.</text>
</g>
<g class="atom-region" data-region="text">
<text x="48" y="216" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">TEXT TO SPEAK</text>
<rect x="48" y="232" width="784" height="144" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
<text x="64" y="264" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">(sigh) It is good to hear your voice again</text>
<text x="64" y="288" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">after all this time.</text>
<text x="64" y="360" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">87 / 512 TOKENS</text>
</g>
<g class="atom-region" data-region="instr">
<text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">INSTRUCTION</text>
<rect x="48" y="416" width="784" height="56" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
<text x="64" y="448" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">A warm, thoughtful young woman, calm delivery.</text>
</g>
<g class="atom-region" data-region="ev">
<text x="48" y="496" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">VOCAL EVENTS / EN</text>
