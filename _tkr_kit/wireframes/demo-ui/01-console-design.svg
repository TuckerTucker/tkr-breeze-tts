<text x="136" y="533" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">(sigh)</text>
<text x="208" y="533" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">(cough)</text>
<text x="288" y="533" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">(breath)</text>
