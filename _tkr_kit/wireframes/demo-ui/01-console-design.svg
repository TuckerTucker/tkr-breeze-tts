<rect x="128" y="512" width="64" height="32" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />
<rect x="200" y="512" width="72" height="32" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />
<rect x="280" y="512" width="80" height="32" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />
