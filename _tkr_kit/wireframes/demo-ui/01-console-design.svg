<text x="48" y="604" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#000000">42</text>
<text x="144" y="604" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">REROLL</text>
<line x1="48" y1="632" x2="832" y2="632" stroke="#E0E0E0" stroke-width="1" />
<text x="48" y="680" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#E3000B">Generate →</text>
<text x="208" y="680" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">WARM / EXPECTED 38MS TO FIRST AUDIO</text>
</g>
<g class="atom-region" data-region="hist">
<text x="904" y="96" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">CLIPS THIS SESSION</text>
