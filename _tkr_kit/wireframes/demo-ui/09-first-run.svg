<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">First run — nothing generated yet</title>
<desc id="d">The empty state: Design is the only usable mode with no saved voice, the instruction is pre-filled with a sensible default, generate is disabled with its reason, and both panels explain how they fill.</desc>
<g class="atom-region" data-region="chrome">
<rect x="0" y="0" width="1280" height="800" fill="#FFFFFF" />
<rect x="880" y="64" width="400" height="736" fill="#F5F5F5" />
<text x="48" y="40" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#000000">Breeze TTS 2</text>
<circle cx="824" cy="34" r="4" fill="#666666" />
<text x="840" y="38" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">GPU ASLEEP / NOTHING GENERATED YET</text>
<line x1="0" y1="64" x2="1280" y2="64" stroke="#000000" stroke-width="1" />
<line x1="880" y1="64" x2="880" y2="800" stroke="#E0E0E0" stroke-width="1" />
</g>
<g class="atom-region" data-region="mode">
<rect x="48" y="112" width="320" height="48" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
<rect x="48" y="112" width="112" height="48" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />
<line x1="160" y1="112" x2="160" y2="160" stroke="#E0E0E0" stroke-width="1" />
<line x1="272" y1="112" x2="272" y2="160" stroke="#E0E0E0" stroke-width="1" />
<text x="64" y="142" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">Design</text>
<text x="176" y="142" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Clone</text>
<text x="288" y="142" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Direction</text>
<text x="48" y="96" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">VOICE MODE</text>
<text x="48" y="184" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DESIGN IS THE ONLY MODE THAT WORKS YET — CLONE AND DIRECTION NEED REFERENCE AUDIO.</text>
</g>
<g class="atom-region" data-region="text">
<text x="48" y="216" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">TEXT TO SPEAK</text>
<rect x="48" y="232" width="784" height="144" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
<text x="64" y="264" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Type a line and press generate.</text>
</g>
<g class="atom-region" data-region="instr">
<text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">INSTRUCTION / PRE-FILLED WITH A SENSIBLE DEFAULT</text>
<rect x="48" y="416" width="784" height="56" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
<text x="64" y="448" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Speak clearly and naturally.</text>
</g>
<g class="atom-region" data-region="start">
<rect x="48" y="496" width="784" height="120" fill="#F5F5F5" />
<text x="72" y="528" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">START HERE</text>
<text x="72" y="560" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">01   Describe a voice, or just type a line and generate.</text>
<text x="72" y="584" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">02   Save a clip you like as a voice — that is how the library fills.</text>
<text x="72" y="608" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">03   Clone and Direction unlock once one voice exists.</text>
</g>
<g class="atom-region" data-region="cta">
<text x="48" y="672" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Generate →</text>
<text x="208" y="672" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">ENTER SOME TEXT TO ENABLE</text>
</g>
<g class="atom-region" data-region="panel">
<text x="904" y="96" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">CLIPS THIS SESSION</text>
<text x="904" y="140" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#000000">00</text>
<line x1="904" y1="168" x2="1256" y2="168" stroke="#E0E0E0" stroke-width="1" />
<text x="904" y="200" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Nothing yet.</text>
<text x="904" y="232" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">GENERATED CLIPS APPEAR HERE AND</text>
<text x="904" y="248" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">REPLAY FOR FREE, EVEN WHILE THE</text>
<text x="904" y="264" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">GPU IS ASLEEP.</text>
<line x1="904" y1="296" x2="1256" y2="296" stroke="#E0E0E0" stroke-width="1" />
<text x="904" y="328" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">NO SAVED VOICES YET</text>
<text x="904" y="352" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">SAVING A CLIP IS HOW VOICES GET HERE</text>
</g>
</svg>