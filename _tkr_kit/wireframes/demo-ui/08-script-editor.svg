<text x="608" y="590" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">NARRATOR — CALM</text>
<text x="816" y="590" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">0:14.8</text>
<text x="906" y="590" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">—</text>
<text x="996" y="590" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">—</text>
<text x="1096" y="590" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">QUEUED</text>
</g>
<g class="atom-region" data-region="drift">
<rect x="48" y="624" width="1184" height="72" fill="#F5F5F5" />
<text x="72" y="656" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">CUE 03 RUNS 0.7S LONGER THAN ITS SLOT</text>
<text x="72" y="684" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Reroll the seed, shorten the line, or accept — the audio is never stretched to fit.</text>
</g>
