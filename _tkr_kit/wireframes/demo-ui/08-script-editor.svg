<text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">01</text>
<text x="96" y="254" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">It is good to hear your voice again.</text>
<text x="608" y="254" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">NARRATOR — CALM</text>
<text x="816" y="254" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">0:00.0</text>
<text x="906" y="254" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">3.4S</text>
<text x="996" y="254" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">—</text>
<text x="1096" y="254" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DONE</text>
<text x="48" y="306" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">02</text>
<text x="96" y="310" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">After all this time.</text>
<text x="608" y="310" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">NARRATOR — CALM</text>
<text x="816" y="310" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">0:03.5</text>
<text x="906" y="310" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">1.6S</text>
<text x="996" y="310" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">—</text>
<text x="1096" y="310" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DONE</text>
<text x="48" y="362" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">03</text>
<text x="96" y="366" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">We need to move. Now.</text>
<text x="608" y="366" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">URGENT ANNOUNCER</text>
<text x="816" y="366" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">0:05.1</text>
<text x="906" y="366" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">2.3S</text>
<text x="996" y="366" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">+0.7s</text>
<text x="1096" y="366" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DRIFTED</text>
<text x="48" y="418" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">04</text>
<text x="96" y="422" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">There is no time to explain.</text>
<text x="608" y="422" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">URGENT ANNOUNCER</text>
<text x="816" y="422" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">0:07.0</text>
<text x="906" y="422" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">—</text>
<text x="996" y="422" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">—</text>
<text x="1096" y="422" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">GENERATING</text>
<circle cx="1080" cy="418" r="3" fill="#E3000B" />
<text x="48" y="474" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">05</text>
