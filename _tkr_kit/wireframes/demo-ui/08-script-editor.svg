<rect x="48" y="384" width="1184" height="56" fill="#F5F5F5" />
<line x1="48" y1="440" x2="1232" y2="440" stroke="#E0E0E0" stroke-width="1" />
<line x1="48" y1="496" x2="1232" y2="496" stroke="#E0E0E0" stroke-width="1" />
