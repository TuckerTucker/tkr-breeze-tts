<text x="96" y="534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">The door is at the end of the hall.</text>
<text x="608" y="534" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">SAM — RECORDED</text>
<text x="816" y="534" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">0:12.0</text>
<text x="906" y="534" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">—</text>
<text x="996" y="534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">—</text>
<text x="1096" y="534" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">QUEUED</text>
