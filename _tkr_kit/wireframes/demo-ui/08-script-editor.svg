<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Script editor — cue list with per-cue voice and drift</title>
<desc id="d">A WebVTT script as an editable cue list: a library voice per line, per-cue state, target-versus-actual timing with drift, and a run that regenerates only stale cues.</desc>
<g class="atom-region" data-region="chrome">
<rect x="0" y="0" width="1280" height="800" fill="#FFFFFF" />
<text x="48" y="40" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#000000">Breeze TTS 2</text>
<circle cx="1000" cy="34" r="4" fill="#000000" />
<text x="1016" y="38" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">GPU WARM / RUNNING SCRIPT</text>
<line x1="0" y1="64" x2="1280" y2="64" stroke="#000000" stroke-width="1" />
</g>
<g class="atom-region" data-region="head">
<text x="48" y="96" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">SCRIPT / IMPORTED FROM WEBVTT</text>
<text x="48" y="144" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#000000">07</text>
<text x="120" y="144" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">cues</text>
<text x="248" y="144" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">rescue-scene.vtt</text>
<text x="608" y="120" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">PROGRESS</text>
<text x="608" y="144" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#000000">03</text>
<text x="672" y="144" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">of 07 done</text>
<text x="928" y="120" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">ONLY STALE CUES RERUN</text>
<text x="928" y="144" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">EDITING ONE LINE COSTS ONE REQUEST</text>
</g>
<g class="atom-region" data-region="table">
<line x1="48" y1="184" x2="1232" y2="184" stroke="#000000" stroke-width="1" />
<text x="48" y="204" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">CUE</text>
<text x="96" y="204" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">LINE</text>
<text x="608" y="204" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">VOICE</text>
<text x="816" y="204" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">TARGET</text>
<text x="906" y="204" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">ACTUAL</text>
<text x="996" y="204" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DRIFT</text>
<text x="1096" y="204" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">STATE</text>
