<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Cold start — waking the GPU</title>
<desc id="d">Serverless cold start told honestly: elapsed time, expected duration, the warm latency that follows, and why it happens. Generate is disabled and queued.</desc>
<g class="atom-region" data-region="chrome">
<rect x="0" y="0" width="1280" height="800" fill="#FFFFFF" />
<rect x="880" y="64" width="400" height="736" fill="#F5F5F5" />
<text x="48" y="40" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#000000">Breeze TTS 2</text>
<circle cx="824" cy="34" r="4" fill="#666666" />
<text x="840" y="38" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">GPU ASLEEP / NEXT REQUEST IS A COLD START</text>
<line x1="0" y1="64" x2="1280" y2="64" stroke="#000000" stroke-width="1" />
<line x1="880" y1="64" x2="880" y2="800" stroke="#E0E0E0" stroke-width="1" />
</g>
<g class="atom-region" data-region="wake">
<rect x="48" y="96" width="784" height="152" fill="#F5F5F5" />
<line x1="48" y1="96" x2="832" y2="96" stroke="#000000" stroke-width="2" />
<text x="72" y="128" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">WAKING THE GPU / CONTAINER COLD START</text>
<text x="72" y="180" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="700" fill="#000000">18</text>
<text x="144" y="180" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">seconds elapsed</text>
<text x="72" y="216" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">EXPECTED 45S / THEN 38MS PER CLIP ONCE WARM</text>
<line x1="72" y1="232" x2="368" y2="232" stroke="#000000" stroke-width="2" />
<line x1="368" y1="232" x2="808" y2="232" stroke="#E0E0E0" stroke-width="1" />
</g>
<g class="atom-region" data-region="why">
<text x="48" y="288" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">WHY THIS HAPPENS</text>
<text x="48" y="320" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">The container scaled to zero after 5 minutes idle. Loading</text>
<text x="48" y="344" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">7.7 GB of weights and capturing 53 CUDA graphs takes time.</text>
<text x="48" y="368" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">This cost is paid once, then every clip is fast.</text>
<line x1="48" y1="400" x2="832" y2="400" stroke="#E0E0E0" stroke-width="1" />
</g>
<g class="atom-region" data-region="text">
<text x="48" y="432" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">TEXT TO SPEAK / QUEUED</text>
<rect x="48" y="448" width="784" height="88" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />
<text x="64" y="480" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Welcome aboard. Your journey begins now.</text>
</g>
<g class="atom-region" data-region="cta">
<text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Generate →</text>
<text x="208" y="608" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">QUEUED UNTIL THE GPU IS WARM</text>
</g>
<g class="atom-region" data-region="hist">
<text x="904" y="96" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">CLIPS THIS SESSION</text>
<text x="904" y="140" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#000000">03</text>
<line x1="904" y1="168" x2="1256" y2="168" stroke="#E0E0E0" stroke-width="1" />
<line x1="904" y1="240" x2="1256" y2="240" stroke="#E0E0E0" stroke-width="1" />
<line x1="904" y1="312" x2="1256" y2="312" stroke="#E0E0E0" stroke-width="1" />
<text x="904" y="194" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">01</text>
<text x="944" y="198" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">It is good to hear your voice</text>
<text x="944" y="218" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DESIGN / CFG 1.0 / SEED 42 / 38MS</text>
<text x="904" y="266" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">02</text>
<text x="944" y="270" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">Welcome aboard, traveller.</text>
<text x="944" y="290" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">DESIGN / CFG 1.0 / SEED 17 / 41MS</text>
<text x="904" y="338" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">03</text>
<text x="944" y="342" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#000000">The journey begins now.</text>
<text x="944" y="362" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">CLONE / CFG 4.0 / SEED 42 / 44MS</text>
<line x1="904" y1="384" x2="1256" y2="384" stroke="#E0E0E0" stroke-width="1" />
<text x="904" y="416" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.16em">REPLAY WORKS WHILE ASLEEP / NO GPU NEEDED</text>
</g>
</svg>