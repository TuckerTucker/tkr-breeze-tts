capability: measurement
slices:
  - paths:
      - bench/harness.py
      - bench/__init__.py
      - bench/pyproject.toml
      - bench/tests/test_harness.py
    depends_on: []
    story_ids:
      - measure-first-audio-latency
    delivers:
      - Time-to-first-audio measured at the client from request send to first
        PCM byte — the only honest place to measure it, since the value under
        test is end-to-end.
      - Real-time factor from wall time over audio duration, with duration
        derived exactly as bytes / 2 / 24000 (mono s16le at 24kHz) rather than
        estimated.
      - Cold and warm runs reported as distinct classes, cold forced by idling
        past the scaledown window instead of assumed.
      - Warmup milliseconds scraped from the log line the vendor already emits,
        decomposing cold start into container start, weight load, and graph
        capture rather than one opaque number.
      - Results written to a file the brief and plan can cite by path.
      - The capability's own dependency and test manifest
        (bench/pyproject.toml), so the harness can be installed and its own
        checks run inside its territory rather than against a manifest no slice
        owns.
    title: "Latency harness: first-audio, real-time factor, cold versus warm"
    number: 1
    layer: integration
    feature: latency-harness
    status: done
    evidence:
      kind: commit
      ref: 183a1a0
  - paths:
      - bench/cfg_probe.py
      - bench/findings
      - bench/tests/test_cfg_probe.py
    depends_on:
      - 1
    story_ids:
      - probe-the-cfg-fast-path
    delivers:
      - "The experiment that closes the plan's one open decision: identical warm
        requests at cfg_scale 1.0 and 4.0 (both captured in configs/fast.json)
        against an uncaptured value such as 2.5."
      - A token-length probe above the 512-token captured ceiling, since the
        same freeze_after_warmup mechanism governs both.
      - Warm-only execution, because a cold start would swamp the effect being
        measured.
      - A recorded finding stating plainly whether a continuous CFG slider
        preserves the latency claim — the evidence the demo-ui CFG control is
        built against, rather than an assumption read out of a config file.
      - The finding written where the brief and the plan's open decision can
        cite it by path.
    title: CFG fast-path fall-off probe
    number: 2
    layer: integration
    feature: cfg-falloff-probe
    status: done
    evidence:
      kind: commit
      ref: 183a1a0
  - number: 3
    feature: reference-ceiling-probe
    depends_on:
      - 1
    story_ids:
      - measure-the-reference-duration-wall
    paths:
      - bench/reference_probe.py
      - bench/tests/test_reference_probe.py
      - bench/findings/reference-ceiling.json
      - bench/harness.py
      - bench/tests/test_harness.py
    delivers:
      - The number the trim control is sized against. backbone_prefill is frozen
        at the same 24 shapes as the text encoder, keyed on sequence_length —
        which counts the reference audio's frames — so reference duration has a
        hard wall and nobody has measured where it is.
      - A walk upward through reference durations against a warm container,
        recording for each whether it served or raised, with the graph shape
        from the RuntimeError captured verbatim rather than paraphrased.
      - The ceiling recorded per branch-batch mode, because backbone_prefill is
        keyed on branch_batch_size exactly as the text encoder is, and one
        number for both modes would be wrong for one of them.
      - A finding stating plainly that the wall is a hard failure and not a
        slowdown, so no consumer treats it as a soft limit worth approaching.
      - The finding written where the gateway already reads cfg-falloff.json, so
        the UI reads a measured maximum instead of carrying a constant somebody
        picked.
    title: Reference-duration ceiling probe
    layer: integration
    status: done
    evidence:
      kind: commit
      ref: 76fa942
