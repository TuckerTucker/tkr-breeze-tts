      - "Inherited-value invalidation: changing a default marks only cues that
        actually inherit that field stale."
      - Cache identity covering every effective setting, including delivery
        instruction, so a visible change cannot reuse stale audio.
    title: Persist script defaults and cue overrides
    layer: data
    status: done
    evidence:
