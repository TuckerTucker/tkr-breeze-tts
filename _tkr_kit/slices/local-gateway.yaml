      - 9
    story_ids:
      - inherit-script-delivery-with-cue-overrides
    paths:
      - gateway/src/script.ts
      - gateway/test/script.test.ts
    delivers:
      - Persisted script defaults for voice, delivery instruction, CFG, and seed
